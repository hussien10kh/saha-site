<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أنشئ فعالية | ملعبك</title>
<meta name="description" content="نظّم بطولة أو يوم رياضي أو دوري. ادع الفرق والمشاركين بسهولة.">
<meta name="keywords" content="إنشاء بطولة, تنظيم فعالية رياضية, ملعبك">
<link rel="preconnect" href="https://uijijqkbctemcfdzoxlg.supabase.co" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../css/form-ux.css">
<script src="site-core.js"></script>
<script src="data.js"></script>
<script src="store.js"></script>
<script src="../js/vendor/supabase.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/form-ux.js"></script>
<script src="malaabak-api.js"></script>
</head>
<body>

<div id="siteHeader"></div>
<script>SiteCore.mountHeader({ active: "events", hideAddVenue: true });</script>

<div class="form-box" style="max-width:520px;">
  <h1>أنشئ فعالية</h1>
  <p class="muted" style="text-align:center;margin-top:-10px;margin-bottom:20px;">
    نظّم بطولة أو يوم رياضي - رح تظهر بصفحة الفعاليات فوراً.
  </p>

  <div class="field">
    <label>عنوان الفعالية <span class="req">*</span></label>
    <input type="text" id="eTitle" placeholder="مثال: بطولة دمشق للخماسيات" required maxlength="80">
  </div>
  <div class="field">
    <label>نوع الفعالية <span class="req">*</span></label>
    <select id="eType" required>
      <option value="">اختر النوع</option>
      <option>بطولة</option>
      <option>دوري</option>
      <option>يوم رياضي</option>
      <option>مهرجان رياضي</option>
      <option>مباراة استعراضية</option>
    </select>
  </div>
  <div class="field">
    <label>الملعب / المكان</label>
    <input type="text" id="eVenue" placeholder="مثال: ملعب النجوم">
  </div>
  <div class="field">
    <label>المحافظة <span class="req">*</span></label>
    <select id="eGov" required></select>
    <script>document.getElementById('eGov').innerHTML = FormUX.governorateOptionsHTML();</script>
  </div>
  <div class="field">
    <label>المدينة / المنطقة <span class="req">*</span></label>
    <input type="text" id="eCity" placeholder="مثال: المزة" required>
  </div>
  <div class="field">
    <label>التاريخ</label>
    <input type="text" id="eDate" placeholder="مثال: 5 حزيران">
  </div>
  <div class="field">
    <label>الوقت</label>
    <input type="text" id="eTime" placeholder="مثال: 4:00 م - 10:00 م">
  </div>
  <div class="field">
    <label>عدد الفرق المطلوب <span class="req">*</span></label>
    <input type="number" id="eTeams" placeholder="مثال: 16" min="2" inputmode="numeric" required>
  </div>
  <div class="field">
    <label>رسوم المشاركة للفريق (ل.س) — اتركها 0 للمجاني</label>
    <input type="number" id="eFee" placeholder="مثال: 50000" min="0" step="1000" inputmode="numeric">
  </div>

  <div class="field">
    <label>وصف الفعالية (اختياري)</label>
    <textarea id="eDesc" placeholder="نظام البطولة، الجوائز، شروط المشاركة..." maxlength="800" rows="3" style="resize:vertical;"></textarea>
  </div>

  <div class="field">
    <label>رقم الجوال للتواصل (اختياري)</label>
    <input type="tel" id="ePhone" placeholder="09xxxxxxxx" inputmode="tel" maxlength="20">
  </div>

  <button type="button" class="btn btn-primary" id="submitBtn" style="display:block;width:100%;">إنشاء الفعالية</button>
  <p class="muted" style="font-size:0.8em;text-align:center;margin-top:0.6em;">املأ الحقول المطلوبة وراح تظهر فعاليتك بصفحة الفعاليات فوراً.</p>
</div>

<script>
(async function setupAddEvent() {
  const $ = (id) => document.getElementById(id);
  const submitBtn = $("submitBtn");
  const EMOJI = { "بطولة": "🏆", "دوري": "🥇", "يوم رياضي": "🎉", "مهرجان رياضي": "🎪", "مباراة استعراضية": "⭐" };

  await FormUX.requireAuth({ loginUrl: 'login.html', submitBtnId: 'submitBtn' });

  FormUX.attachLiveValidator($("eTitle"), FormUX.isMeaningfulText, 'عنوان الفعالية مو واضح');
  FormUX.attachLiveValidator($("eCity"), FormUX.isMeaningfulText, 'اسم المدينة مو واضح');

  submitBtn.addEventListener("click", async () => {
    if (submitBtn.dataset.authGate === '1') return;
    FormUX.clearFieldErrors();
    const titleEl = $("eTitle"), typeEl = $("eType"), govEl = $("eGov"), cityEl = $("eCity"), teamsEl = $("eTeams");
    const title = titleEl.value.trim();
    const type = typeEl.value;
    const venueName = $("eVenue").value.trim();
    const governorate = govEl.value.trim();
    const city = cityEl.value.trim();
    const dateLabel = $("eDate").value.trim();
    const time = $("eTime").value.trim();
    const maxTeams = Number(teamsEl.value);
    const fee = Number($("eFee").value);

    if (!FormUX.isMeaningfulText(title)) return FormUX.markFieldError(titleEl, 'عنوان الفعالية مو واضح');
    if (!type) return FormUX.markFieldError(typeEl, 'اختر نوع الفعالية');
    if (!governorate) return FormUX.markFieldError(govEl, 'اختر المحافظة');
    if (!FormUX.isMeaningfulText(city)) return FormUX.markFieldError(cityEl, 'اسم المدينة مو واضح');
    if (!maxTeams || maxTeams < 2) return FormUX.markFieldError(teamsEl, 'عدد الفرق لازم يكون 2 على الأقل');

    FormUX.setSubmitLoading(submitBtn, true, 'جاري الحفظ...');
    try {
      await MalaabakAPI.create("events", {
        title, type, governorate, city,
        venue_name: venueName || "يحدّد لاحقاً",
        date_label: dateLabel || "قريباً", day: null, time: time || "يحدّد لاحقاً",
        fee: fee || 0, teams: 0, max_teams: maxTeams,
        image: EMOJI[type] || "🏆",
        phone: ($("ePhone").value.trim()) || null,
        description: ($("eDesc").value.trim()) || null,
      });
      FormUX.clearDraft();
      // Meta Pixel — قاع الـfunnel: الإضافة نجحت فعلاً (بعد ما رجع الـAPI بلا خطأ).
      window.MetaPixel?.addListing({
        type: 'event', category: type,
        governorate, city, section: 'malaab',
      });
      FormUX.toast('تم إنشاء الفعالية ✓', 'success', 2000);
      setTimeout(() => { location.href = "events.html"; }, 1100);
    } catch (err) {
      console.error(err);
      FormUX.toast(FormUX.friendlyError(err), 'error');
      FormUX.setSubmitLoading(submitBtn, false);
    }
  });
})();
</script>

<div id="siteFooter"></div>
<script>SiteCore.mountFooter();</script>

<script src="../js/meta-pixel.js"></script>
<script src="../js/consent-banner.js"></script>
</body>
</html>
