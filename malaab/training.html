<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التمارين | ملعبك — تمارين مفتوحة للانضمام</title>
<meta name="description" content="تمارين لياقة، مهارات كرة قدم، حراس مرمى، ويوغا في كل المحافظات. سجّل بالتمرين اللي يناسب فترتك ورياضتك.">
<meta name="keywords" content="تمارين لياقة سوريا, تدريب كرة قدم, يوغا دمشق, تدريب حراس, ملعبك">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="site-core.js"></script>
<script src="data.js"></script>
<script src="store.js"></script>
<script src="list-page.js"></script>
<script src="../js/vendor/supabase.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="malaabak-api.js"></script>
<script src="data-bridge.js"></script>
<script src="../js/meta-pixel.js"></script>
<script src="../js/consent-banner.js"></script>
</head>
<body>

<div id="siteHeader"></div>
<script>SiteCore.mountHeader({ active: "training" });</script>

<section class="hero">
  <h1>التمارين المفتوحة</h1>
  <p>انضم للتمارين وطوّر من مستواك</p>

  <div class="search-box">
    <div class="field search-field">
      <input type="text" id="freeSearch" placeholder="ابحث عن تمرين أو مدرب">
    </div>

    <div class="search-filters-row">
      <div class="field filter-field">
        <label><span class="icon">📅</span> التاريخ</label>
        <div class="date-select-group">
          <select id="filterDay" aria-label="اليوم"></select>
          <select id="filterMonth" aria-label="الشهر"></select>
          <select id="filterYear" aria-label="السنة"></select>
        </div>
      </div>
      <div class="field filter-field">
        <label><span class="icon">🏅</span> نوع التمرين</label>
        <select id="filterSport">
          <option value="">كل الأنواع</option>
          <option value="لياقة عامة">لياقة عامة</option>
          <option value="كرة قدم">كرة قدم</option>
          <option value="تمارين حراس">تمارين حراس</option>
          <option value="يوغا">يوغا</option>
          <option value="كروس فت">كروس فت</option>
          <option value="تدريبات أطفال">تدريبات أطفال</option>
          <option value="تأهيل إصابات">تأهيل إصابات</option>
        </select>
      </div>
      <div class="field filter-field">
        <label><span class="icon">🗺️</span> المحافظة</label>
        <select id="filterGovernorate">
          <option value="">كل المحافظات</option>
        </select>
      </div>
      <div class="field filter-field">
        <label><span class="icon">📍</span> المدينة / المنطقة</label>
        <input type="text" id="filterCity" list="cityOptions" placeholder="اكتب أو اختر منطقة">
        <datalist id="cityOptions"></datalist>
      </div>
      <button type="button" id="searchBtn" class="btn btn-primary"><span class="search-icon"></span> ابحث الآن</button>
    </div>
  </div>
</section>

<div class="section">
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <h2>التمارين القادمة</h2>
    <a href="add-training.html" class="btn btn-primary">+ إنشاء تمرين</a>
  </div>
  <div class="venues-layout">
    <aside class="venues-sidebar">
      <h3>تصفية النتائج</h3>

      <div class="filter-group">
        <label for="sbCity">المدينة</label>
        <select id="sbCity"><option value="">كل المدن</option></select>
      </div>

      <div class="filter-group">
        <label>نوع التمرين</label>
        <div class="filter-checks" id="sbType">
          <label><input type="checkbox" value="لياقة عامة"> لياقة عامة</label>
          <label><input type="checkbox" value="كرة قدم"> كرة قدم</label>
          <label><input type="checkbox" value="تمارين حراس"> تمارين حراس</label>
          <label><input type="checkbox" value="يوغا"> يوغا</label>
          <label><input type="checkbox" value="كروس فت"> كروس فت</label>
          <label><input type="checkbox" value="تدريبات أطفال"> تدريبات أطفال</label>
          <label><input type="checkbox" value="تأهيل إصابات"> تأهيل إصابات</label>
        </div>
      </div>

      <div class="filter-group">
        <label>الوقت</label>
        <div class="filter-radios" id="sbPeriod">
          <label><input type="radio" name="sbPeriod" value="" checked> الكل</label>
          <label><input type="radio" name="sbPeriod" value="صباحاً"> صباحاً</label>
          <label><input type="radio" name="sbPeriod" value="مساءً"> مساءً</label>
          <label><input type="radio" name="sbPeriod" value="ليلاً"> ليلاً</label>
        </div>
      </div>

      <div class="filter-group">
        <label>أماكن متاحة</label>
        <div class="filter-checks" id="sbAvailability">
          <label><input type="checkbox" id="sbHasSpace" value="1"> فيه أماكن شاغرة</label>
        </div>
      </div>

      <div class="filter-group">
        <label for="sbPrice" class="filter-price-label">السعر <span class="filter-price-hint">(حتى <span id="sbPriceValue" class="filter-price-value">20000</span> ل.س)</span></label>
        <input type="range" id="sbPrice" min="7000" max="20000" step="1000" value="20000">
        <input type="number" id="sbPriceInput" class="filter-price-input" min="7000" max="20000" step="1000" value="20000" aria-label="أدخل السعر بالضبط">
      </div>

      <button type="button" id="sbClear" class="btn btn-outline filter-clear-btn">مسح جميع الفلاتر</button>
    </aside>

    <div class="venues-main">
      <div class="venues-toolbar">
        <span id="trainingCount" class="muted"></span>
        <select id="sbSort">
          <option value="default">ترتيب حسب: الأقرب</option>
          <option value="price-asc">السعر: من الأقل للأعلى</option>
          <option value="price-desc">السعر: من الأعلى للأقل</option>
          <option value="spots">الأكثر أماكن شاغرة</option>
        </select>
      </div>
      <div class="venues-grid" id="trainingGrid"></div>
      <div id="trainingNoResults" class="search-empty">
        <div class="search-empty-icon">🔍</div>
        <p class="search-empty-title">لا توجد نتيجة متطابقة</p>
        <p class="search-empty-hint" id="trainingNoResultsHint"></p>
        <button type="button" class="btn btn-outline" id="trainingClearSearch">مسح البحث</button>
      </div>
      <div class="venues-pagination" id="trainingPagination"></div>
    </div>
  </div>
</div>

<div class="section" style="padding-top:0;">
  <h2>ليش تنضم للتمارين؟</h2>
  <div class="features-strip">
    <div class="feature-item">
      <span class="feature-icon">🎓</span>
      <div class="feature-title">مدربين محترفين</div>
      <div class="feature-sub">تدرّب على يد أفضل المدربين</div>
    </div>
    <div class="feature-item">
      <span class="feature-icon">🤸</span>
      <div class="feature-title">تمارين متنوعة</div>
      <div class="feature-sub">اختر يلي بناسب اهتمامك</div>
    </div>
    <div class="feature-item">
      <span class="feature-icon">🤝</span>
      <div class="feature-title">تعرّف على أصدقاء</div>
      <div class="feature-sub">كوّن صداقات رياضية</div>
    </div>
    <div class="feature-item">
      <span class="feature-icon">📈</span>
      <div class="feature-title">طوّر مستواك</div>
      <div class="feature-sub">حسّن مهاراتك ولياقتك</div>
    </div>
  </div>
</div>

<div id="siteFooter"></div>
<script>SiteCore.mountFooter();</script>

<script>
SiteCore.fillDateSelects();
const { govSelect, cityInput, refreshCityOptions } = SiteCore.setupGovCity();

// ===== صفحة التمارين: إعدادات فقط =====
(async function setupTraining() {
  await DataBridge.load("trainings");
  const sbCity = document.getElementById("sbCity");
  const sbPrice = document.getElementById("sbPrice");
  const sbPriceInput = document.getElementById("sbPriceInput");
  const sbPriceValue = document.getElementById("sbPriceValue");
  const sbSort = document.getElementById("sbSort");
  const sbClear = document.getElementById("sbClear");
  const sbHasSpace = document.getElementById("sbHasSpace");
  const sbTypeBoxes = [...document.querySelectorAll("#sbType input")];
  const sbPeriodRadios = [...document.querySelectorAll('input[name="sbPeriod"]')];

  const approved = () => SITE_DATA.trainings.filter((t) => t.status === "approved");

  [...new Set(approved().map((t) => t.city))].forEach((city) => {
    sbCity.appendChild(new Option(city, city));
  });

  const fees = approved().map((t) => t.fee);
  const feeMin = Math.floor(Math.min(...fees) / 1000) * 1000;
  const feeMax = Math.ceil(Math.max(...fees) / 5000) * 5000;
  sbPrice.min = sbPriceInput.min = feeMin;
  sbPrice.max = sbPriceInput.max = feeMax;
  sbPrice.value = sbPriceInput.value = feeMax;
  sbPriceValue.textContent = feeMax.toLocaleString("en-US");

  function trainingCardHTML(t) {
    const isFull = t.participants >= t.maxParticipants;
    const badgeClass = isFull ? " unavailable" : "";
    const badgeText = isFull ? "مكتمل" : t.dateLabel;
    return `
      <a href="training-detail.html?id=${t.id}" class="venue-card">
        <div class="venue-card-image"><span class="venue-card-emoji">${t.image}</span><span class="venue-card-badge${badgeClass}">${badgeText}</span></div>
        <div class="venue-card-body">
          <div class="venue-card-title-row"><h3>${t.title}</h3><span class="badge">${t.type}</span></div>
          <p class="muted">${t.venueName} - ${t.city}</p>
          <p class="muted">${t.day} · ${t.time}</p>
          <div class="venue-card-amenities"><span class="tag">${t.coach}</span><span class="tag">${t.participants}/${t.maxParticipants} مشارك</span><button type="button" class="venue-card-amenities-toggle">»</button><div class="venue-card-amenities-panel"></div></div>
          <div class="venue-card-footer">
            <span class="price">${t.fee.toLocaleString("en-US")} ل.س</span>
            <span class="btn btn-primary">${isFull ? "مكتمل" : "سجّل الآن"}</span>
          </div>
        </div>
      </a>`;
  }

  const page = ListPage.create({
    data: approved,
    ids: {
      grid: "trainingGrid", noResults: "trainingNoResults", hint: "trainingNoResultsHint",
      clearSearch: "trainingClearSearch", count: "trainingCount", pagination: "trainingPagination",
    },
    cardHTML: trainingCardHTML,
    haystack: (t) => MalaabakSearch.trainingHaystack(t),
    // نوع التمرين هو نظير الرياضة بهالصفحة - نفس حقل الهيرو #filterSport
    hero: { sportField: "type", govField: "governorate", cityFields: ["city", "venueName"] },
    refreshCityOptions,
    readQueryParams: true,
    countText: (n) => `تم العثور على ${n} ${n <= 2 ? "تمرين" : "تمارين"}`,

    filter(t) {
      const period = document.querySelector('input[name="sbPeriod"]:checked').value;
      const types = sbTypeBoxes.filter((b) => b.checked).map((b) => b.value);
      if (sbCity.value && t.city !== sbCity.value) return false;
      if (t.fee > Number(sbPrice.value)) return false;
      if (period && t.period !== period) return false;
      if (types.length && !types.includes(t.type)) return false;
      if (sbHasSpace.checked && t.participants >= t.maxParticipants) return false;
      return true;
    },
    sort(list) {
      if (sbSort.value === "price-asc") return [...list].sort((a, b) => a.fee - b.fee);
      if (sbSort.value === "price-desc") return [...list].sort((a, b) => b.fee - a.fee);
      if (sbSort.value === "spots") {
        return [...list].sort((a, b) => (b.maxParticipants - b.participants) - (a.maxParticipants - a.participants));
      }
      return list;
    },
    isFilterActive() {
      const period = document.querySelector('input[name="sbPeriod"]:checked').value;
      return !!sbCity.value || Number(sbPrice.value) < Number(sbPrice.max) || !!period
        || sbTypeBoxes.some((b) => b.checked) || sbHasSpace.checked;
    },
    watch: [sbCity, sbSort, sbHasSpace, ...sbTypeBoxes, ...sbPeriodRadios],
    clearBtn: sbClear,
    onClearFilters() {
      sbCity.value = "";
      sbPrice.value = sbPrice.max;
      sbPriceInput.value = sbPrice.max;
      sbPriceValue.textContent = Number(sbPrice.max).toLocaleString("en-US");
      sbTypeBoxes.forEach((b) => { b.checked = false; });
      sbHasSpace.checked = false;
      document.querySelector('input[name="sbPeriod"][value=""]').checked = true;
      sbSort.value = "default";
    },
  });

  sbPrice.addEventListener("input", () => {
    sbPriceInput.value = sbPrice.value;
    sbPriceValue.textContent = Number(sbPrice.value).toLocaleString("en-US");
    page.resetAndRender();
  });
  sbPriceInput.addEventListener("input", () => {
    const val = Number(sbPriceInput.value);
    if (Number.isNaN(val)) return;
    sbPrice.value = Math.min(Number(sbPriceInput.max), Math.max(Number(sbPriceInput.min), val));
    sbPriceValue.textContent = Number(sbPrice.value).toLocaleString("en-US");
    page.resetAndRender();
  });
  sbPriceInput.addEventListener("blur", () => { sbPriceInput.value = sbPrice.value; });
})();
</script>

</body>
</html>
