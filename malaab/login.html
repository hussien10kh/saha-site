<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول | ملعبك</title>
<meta name="description" content="سجّل دخولك على ملعبك بنفس حساب ساحة.">
<meta name="keywords" content="تسجيل دخول, ملعبك, ساحة">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="site-core.js"></script>
<script src="../js/vendor/supabase.js"></script>
<script src="../js/supabase-client.js"></script>
</head>
<body>

<div id="siteHeader"></div>
<script>SiteCore.mountHeader();</script>

<div class="form-box" style="max-width:420px;">
  <h1>تسجيل الدخول</h1>
  <p class="muted" style="text-align:center;margin-top:-8px;margin-bottom:16px;font-size:13px;">
    نفس حساب ساحة يعمل هنا — منصة واحدة، حساب واحد.
  </p>

  <form id="loginForm">
    <div class="field">
      <label>البريد الإلكتروني</label>
      <input type="email" id="email" placeholder="example@mail.com" required autocomplete="email">
    </div>
    <div class="field">
      <label>كلمة المرور</label>
      <input type="password" id="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-primary" id="loginBtn" style="display:block;width:100%;">تسجيل الدخول</button>
    <p class="muted" id="loginHint" style="font-size:13px;text-align:center;margin-top:10px;min-height:1em;"></p>
  </form>

  <div style="text-align:center;margin:14px 0 6px;color:#9aa7c0;font-size:12px;">أو</div>
  <button type="button" class="btn btn-outline" id="guestBtn" style="display:block;width:100%;">ادخل كضيف</button>

  <p style="text-align:center;font-size:13px;margin-top:16px;">
    ليس لديك حساب؟ <a href="register.html" style="color:#0f5c2a;text-decoration:underline;font-weight:700;">إنشاء حساب</a>
  </p>
</div>

<div id="siteFooter"></div>
<script>SiteCore.mountFooter();</script>

<script>
(async function setupLogin() {
  // إذا مسجّل دخول أصلاً — حوّله لوجهته
  const redirect = new URLSearchParams(location.search).get("redirect") || "index.html";
  const { data: { user } } = await sb.auth.getUser();
  if (user) { location.href = redirect; return; }

  const form = document.getElementById("loginForm");
  const emailEl = document.getElementById("email");
  const passEl = document.getElementById("password");
  const btn = document.getElementById("loginBtn");
  const hint = document.getElementById("loginHint");
  const guestBtn = document.getElementById("guestBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    hint.textContent = "";
    btn.disabled = true; btn.textContent = "جاري الدخول...";
    const { error } = await sb.auth.signInWithPassword({ email: emailEl.value.trim(), password: passEl.value });
    if (error) {
      hint.textContent = error.message === "Invalid login credentials"
        ? "البريد أو كلمة المرور غير صحيحة."
        : "تعذّر الدخول: " + error.message;
      btn.disabled = false; btn.textContent = "تسجيل الدخول";
      return;
    }
    location.href = redirect;
  });

  guestBtn.addEventListener("click", async () => {
    guestBtn.disabled = true; guestBtn.textContent = "جاري الدخول...";
    const { error } = await sb.auth.signInAnonymously();
    if (error) {
      hint.textContent = "تعذّر الدخول كضيف: " + error.message;
      guestBtn.disabled = false; guestBtn.textContent = "ادخل كضيف";
      return;
    }
    location.href = redirect;
  });
})();
</script>

</body>
</html>
