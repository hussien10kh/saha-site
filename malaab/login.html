<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول | ملعبك</title>
<meta name="description" content="سجّل دخولك على ملعبك بنفس حساب ساحة.">
<meta name="keywords" content="تسجيل دخول, ملعبك, ساحة">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../css/form-ux.css">
<script src="site-core.js"></script>
<script src="../js/vendor/supabase.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/form-ux.js"></script>
</head>
<body>

<div id="siteHeader"></div>
<script>SiteCore.mountHeader();</script>

<div class="form-box" style="max-width:420px;">
  <h1>تسجيل الدخول</h1>
  <p class="muted" style="text-align:center;margin-top:-8px;margin-bottom:16px;font-size:13px;">
    نفس حساب ساحة يعمل هنا — منصة واحدة، حساب واحد.
  </p>

  <form id="loginForm" novalidate>
    <div class="field">
      <label>البريد الإلكتروني <span class="req">*</span></label>
      <input type="email" id="email" placeholder="example@mail.com" required autocomplete="email" inputmode="email">
    </div>
    <div class="field">
      <label>كلمة المرور <span class="req">*</span></label>
      <div class="fux-pw-wrap">
        <input type="password" id="password" required autocomplete="current-password">
        <button type="button" class="fux-pw-toggle" data-target="password" aria-label="إظهار/إخفاء كلمة المرور">👁</button>
      </div>
    </div>
    <button type="submit" class="btn btn-primary" id="loginBtn" style="display:block;width:100%;">تسجيل الدخول</button>
  </form>

  <p style="text-align:center;font-size:13px;margin-top:16px;">
    ليس لديك حساب؟ <a href="register.html" style="color:#0f5c2a;text-decoration:underline;font-weight:700;">إنشاء حساب</a>
  </p>
</div>

<div id="siteFooter"></div>
<script>SiteCore.mountFooter();</script>

<script>
// Password toggle عام
document.addEventListener('click', (e) => {
  const btn = e.target.closest('.fux-pw-toggle');
  if (!btn) return;
  const inp = document.getElementById(btn.dataset.target);
  if (!inp) return;
  inp.type = inp.type === 'password' ? 'text' : 'password';
  btn.textContent = inp.type === 'password' ? '👁' : '🙈';
});

(async function setupLogin() {
  const redirect = new URLSearchParams(location.search).get("redirect") || "index.html";
  const { data: { user } } = await sb.auth.getUser();
  if (user) { location.href = redirect; return; }

  const form = document.getElementById("loginForm");
  const emailEl = document.getElementById("email");
  const passEl = document.getElementById("password");
  const btn = document.getElementById("loginBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    FormUX.clearFieldErrors();
    const email = emailEl.value.trim();
    if (!email || !/.+@.+\..+/.test(email)) return FormUX.markFieldError(emailEl, 'أدخل بريد إلكتروني صحيح');
    if (!passEl.value) return FormUX.markFieldError(passEl, 'أدخل كلمة المرور');

    FormUX.setSubmitLoading(btn, true, 'جاري الدخول...');
    try {
      const { error } = await sb.auth.signInWithPassword({ email, password: passEl.value });
      if (error) throw error;
      location.href = redirect;
    } catch (err) {
      console.error(err);
      FormUX.toast(FormUX.friendlyError(err), 'error');
      FormUX.setSubmitLoading(btn, false);
    }
  });
})();
</script>

</body>
</html>
