<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إنشاء تمرين | ملعبك</title>
<meta name="description" content="أنشئ حصة تدريبية مفتوحة وادع اللاعبين للانضمام.">
<meta name="keywords" content="إنشاء تمرين, حصة تدريبية سوريا, ملعبك">
<link rel="preconnect" href="https://uijijqkbctemcfdzoxlg.supabase.co" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../css/form-ux.css">
<script src="site-core.js"></script>
<script src="data.js"></script>
<script src="store.js"></script>
<script src="../js/vendor/supabase.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/form-ux.js"></script>
<script src="malaabak-api.js"></script>
</head>
<body>

<div id="siteHeader"></div>
<script>SiteCore.mountHeader({ active: "training", hideAddVenue: true });</script>

<div class="form-box" style="max-width:520px;">
  <h1>أنشئ تمرين</h1>
  <p class="muted" style="text-align:center;margin-top:-10px;margin-bottom:20px;">
    نظّم حصة تدريبية وادعُ لاعبين - رح تظهر بصفحة التمارين فوراً.
  </p>

  <div class="field">
    <label>عنوان التمرين <span class="req">*</span></label>
    <input type="text" id="tTitle" placeholder="مثال: تمرين لياقة صباحي" required maxlength="80">
  </div>
  <div class="field">
    <label>نوع التمرين <span class="req">*</span></label>
    <select id="tType" required>
      <option value="">اختر النوع</option>
      <option>لياقة عامة</option>
      <option>مهارات فردية</option>
      <option>تكتيك</option>
      <option>حراسة مرمى</option>
      <option>سرعة ورشاقة</option>
    </select>
  </div>
  <div class="field">
    <label>اسم المدرب</label>
    <input type="text" id="tCoach" placeholder="مثال: محمد الخطيب">
  </div>
  <div class="field">
    <label>الملعب / المكان</label>
    <input type="text" id="tVenue" placeholder="مثال: ملعب النجوم">
  </div>
  <div class="field">
    <label>المحافظة <span class="req">*</span></label>
    <select id="tGov" required></select>
    <script>document.getElementById('tGov').innerHTML = FormUX.governorateOptionsHTML();</script>
  </div>
  <div class="field">
    <label>المدينة / المنطقة <span class="req">*</span></label>
    <input type="text" id="tCity" placeholder="مثال: المزة" required>
  </div>
  <div class="field">
    <label>التاريخ والوقت</label>
    <input type="text" id="tTime" placeholder="مثال: السبت · 6:00 ص - 7:00 ص">
  </div>
  <div class="field">
    <label>الفترة</label>
    <div class="role-picker" id="tPeriod">
      <div class="selected" data-value="صباحاً">صباحاً</div>
      <div data-value="مساءً">مساءً</div>
      <div data-value="ليلاً">ليلاً</div>
    </div>
  </div>
  <div class="field">
    <label>عدد المشاركين المطلوب <span class="req">*</span></label>
    <input type="number" id="tCount" placeholder="مثال: 20" min="2" inputmode="numeric" required>
  </div>
  <div class="field">
    <label>رسوم المشاركة للاعب (ل.س) — اتركها 0 للمجاني</label>
    <input type="number" id="tFee" placeholder="مثال: 8000" min="0" step="500" inputmode="numeric">
  </div>

  <div class="field">
    <label>وصف التمرين (اختياري)</label>
    <textarea id="tDesc" placeholder="محاور التمرين، مستوى المشاركين المتوقّع..." maxlength="500" rows="3" style="resize:vertical;"></textarea>
  </div>

  <div class="field">
    <label>رقم الجوال للتواصل (اختياري)</label>
    <input type="tel" id="tPhone" placeholder="09xxxxxxxx" inputmode="tel" maxlength="20">
  </div>

  <button type="button" class="btn btn-primary" id="submitBtn" style="display:block;width:100%;">إنشاء التمرين</button>
  <p class="muted" style="font-size:0.8em;text-align:center;margin-top:0.6em;">املأ الحقول المطلوبة وراح يظهر تمرينك بصفحة التمارين فوراً.</p>
</div>

<script>
(async function setupAddTraining() {
  const $ = (id) => document.getElementById(id);
  const submitBtn = $("submitBtn");
  await FormUX.requireAuth({ loginUrl: 'login.html', submitBtnId: 'submitBtn' });

  FormUX.attachLiveValidator($("tTitle"), FormUX.isMeaningfulText, 'عنوان التمرين مو واضح');
  FormUX.attachLiveValidator($("tCity"), FormUX.isMeaningfulText, 'اسم المدينة مو واضح');

  let period = "صباحاً";
  $("tPeriod").addEventListener("click", (e) => {
    const opt = e.target.closest("[data-value]");
    if (!opt) return;
    $("tPeriod").querySelectorAll("div").forEach((d) => d.classList.remove("selected"));
    opt.classList.add("selected");
    period = opt.dataset.value;
  });

  submitBtn.addEventListener("click", async () => {
    if (submitBtn.dataset.authGate === '1') return;
    FormUX.clearFieldErrors();
    const titleEl = $("tTitle"), typeEl = $("tType"), govEl = $("tGov"), cityEl = $("tCity"), countEl = $("tCount");
    const title = titleEl.value.trim();
    const type = typeEl.value;
    const coach = $("tCoach").value.trim();
    const venueName = $("tVenue").value.trim();
    const governorate = govEl.value.trim();
    const city = cityEl.value.trim();
    const time = $("tTime").value.trim();
    const maxParticipants = Number(countEl.value);
    const fee = Number($("tFee").value);

    if (!FormUX.isMeaningfulText(title)) return FormUX.markFieldError(titleEl, 'عنوان التمرين مو واضح');
    if (!type) return FormUX.markFieldError(typeEl, 'اختر نوع التمرين');
    if (!governorate) return FormUX.markFieldError(govEl, 'اختر المحافظة');
    if (!FormUX.isMeaningfulText(city)) return FormUX.markFieldError(cityEl, 'اسم المدينة مو واضح');
    if (!maxParticipants || maxParticipants < 2) return FormUX.markFieldError(countEl, 'عدد المشاركين لازم يكون 2 على الأقل');

    FormUX.setSubmitLoading(submitBtn, true, 'جاري الحفظ...');
    try {
      await MalaabakAPI.create("trainings", {
        title, type, governorate, city,
        venue_name: venueName || "يحدّد لاحقاً",
        day: null, date_label: "قريباً", time: time || "يحدّد لاحقاً", period,
        fee: fee || 0, participants: 0, max_participants: maxParticipants,
        coach: coach || null,
        image: "🏃",
        phone: ($("tPhone").value.trim()) || null,
        description: ($("tDesc").value.trim()) || null,
      });
      FormUX.clearDraft();
      // Meta Pixel — قاع الـfunnel: الإضافة نجحت فعلاً (بعد ما رجع الـAPI بلا خطأ).
      window.MetaPixel?.addListing({
        type: 'training', category: type,
        governorate, city, section: 'malaab',
      });
      FormUX.toast('تم إنشاء التمرين ✓', 'success', 2000);
      setTimeout(() => { location.href = "training.html"; }, 1100);
    } catch (err) {
      console.error(err);
      FormUX.toast(FormUX.friendlyError(err), 'error');
      FormUX.setSubmitLoading(submitBtn, false);
    }
  });
})();
</script>

<div id="siteFooter"></div>
<script>SiteCore.mountFooter();</script>

<script src="../js/meta-pixel.js"></script>
<script src="../js/consent-banner.js"></script>
</body>
</html>
