<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-Y4216697RK"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أنشئ مباراة | ملعبك</title>
<meta name="description" content="أنشئ مباراة ودية وادعُ اللاعبين للانضمام. مباريات كرة قدم، صالات، سلة، تنس، وطائرة.">
<meta name="keywords" content="إنشاء مباراة, مباراة ودية سوريا, ملعبك">
<link rel="preconnect" href="https://uijijqkbctemcfdzoxlg.supabase.co" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../css/form-ux.css">
</head>
<body>

<div id="siteHeader"></div>

<div class="form-box" style="max-width:520px;">
  <h1>أنشئ مباراتك</h1>
  <p class="muted" style="text-align:center;margin-top:-10px;margin-bottom:20px;">
    ادعُ لاعبين للانضمام لمباراتك - رح تظهر بصفحة المباريات فوراً.
  </p>

  <div class="field">
    <label>عنوان المباراة <span class="req">*</span></label>
    <input type="text" id="mTitle" placeholder="مثال: مباراة ودية مساء الخميس" required maxlength="80">
  </div>
  <div class="field">
    <label>نوع الرياضة <span class="req">*</span></label>
    <select id="mSport" required>
      <option value="">اختر الرياضة</option>
      <option>كرة قدم</option>
      <option>كرة صالات</option>
      <option>كرة سلة</option>
      <option>تنس</option>
      <option>كرة طائرة</option>
    </select>
  </div>
  <div class="field">
    <label>الملعب <span class="req">*</span></label>
    <input type="text" id="mVenue" placeholder="مثال: ملعب النجوم" required>
  </div>
  <div class="field">
    <label>المحافظة <span class="req">*</span></label>
    <select id="mGov" required></select>
  </div>
  <div class="field">
    <label>المدينة / المنطقة <span class="req">*</span></label>
    <input type="text" id="mCity" placeholder="مثال: المزة" required>
  </div>
  <div class="field">
    <label>اليوم والوقت</label>
    <input type="text" id="mTime" placeholder="مثال: الخميس · 8:00 م - 10:00 م">
  </div>
  <div class="field">
    <label>المستوى</label>
    <div class="role-picker" id="mLevel">
      <div data-value="مبتدئ">مبتدئ</div>
      <div class="selected" data-value="متوسط">متوسط</div>
      <div data-value="محترف">محترف</div>
    </div>
  </div>
  <div class="field">
    <label>عدد اللاعبين المطلوب <span class="req">*</span></label>
    <input type="number" id="mPlayers" placeholder="مثال: 10" min="2" inputmode="numeric" required>
  </div>
  <div class="field">
    <label>رسوم المشاركة للاعب (ل.س)</label>
    <input type="number" id="mFee" placeholder="مثال: 5000" min="0" step="500" inputmode="numeric">
  </div>

  <div class="field">
    <label>وصف المباراة (اختياري)</label>
    <textarea id="mDesc" placeholder="مستوى اللعب المتوقع، شروط الفريق، ملاحظات..." maxlength="500" rows="3" style="resize:vertical;"></textarea>
  </div>

  <div class="field">
    <label>رقم الجوال للتواصل (اختياري)</label>
    <input type="tel" id="mPhone" placeholder="09xxxxxxxx" inputmode="tel" maxlength="20">
  </div>

  <button type="button" class="btn btn-primary" id="submitBtn" style="display:block;width:100%;">إنشاء المباراة</button>
  <p class="muted" style="font-size:0.8em;text-align:center;margin-top:0.6em;">املأ الحقول المطلوبة وراح تظهر مباراتك بصفحة المباريات فوراً.</p>
</div>


<div id="siteFooter"></div>

<script src="site-core.js"></script>
<script src="data.js"></script>
<script src="store.js"></script>
<script src="../js/vendor/supabase.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/form-ux.js"></script>
<script src="malaabak-api.js"></script>
<script src="../js/meta-pixel.js"></script>
<script src="../js/consent-banner.js"></script>
<script>SiteCore.mountHeader({ hideAddVenue: true });</script>
    <script>document.getElementById('mGov').innerHTML = FormUX.governorateOptionsHTML();</script>
<script>
(async function setupAddMatch() {
  const $ = (id) => document.getElementById(id);
  const submitBtn = $("submitBtn");
  const EMOJI = { "كرة قدم": "⚽", "كرة صالات": "🥅", "كرة سلة": "🏀", "تنس": "🎾", "كرة طائرة": "🏐" };

  await FormUX.requireAuth({ loginUrl: 'login.html', submitBtnId: 'submitBtn' });

  FormUX.attachLiveValidator($("mTitle"), FormUX.isMeaningfulText, 'عنوان المباراة مو واضح');
  FormUX.attachLiveValidator($("mVenue"), FormUX.isMeaningfulText, 'اسم الملعب مو واضح');
  FormUX.attachLiveValidator($("mCity"), FormUX.isMeaningfulText, 'اسم المدينة مو واضح');

  let level = "متوسط";
  $("mLevel").addEventListener("click", (e) => {
    const opt = e.target.closest("[data-value]");
    if (!opt) return;
    $("mLevel").querySelectorAll("div").forEach((d) => d.classList.remove("selected"));
    opt.classList.add("selected");
    level = opt.dataset.value;
  });

  submitBtn.addEventListener("click", async () => {
    if (submitBtn.dataset.authGate === '1') return;
    FormUX.clearFieldErrors();
    const titleEl = $("mTitle"), sportEl = $("mSport"), venueEl = $("mVenue"),
          govEl = $("mGov"), cityEl = $("mCity"), playersEl = $("mPlayers");
    const title = titleEl.value.trim();
    const sport = sportEl.value;
    const venueName = venueEl.value.trim();
    const governorate = govEl.value.trim();
    const city = cityEl.value.trim();
    const time = $("mTime").value.trim();
    const maxParticipants = Number(playersEl.value);
    const fee = Number($("mFee").value);

    if (!FormUX.isMeaningfulText(title)) return FormUX.markFieldError(titleEl, 'عنوان المباراة مو واضح');
    if (!sport) return FormUX.markFieldError(sportEl, 'اختر الرياضة');
    if (!FormUX.isMeaningfulText(venueName)) return FormUX.markFieldError(venueEl, 'اسم الملعب مو واضح');
    if (!governorate) return FormUX.markFieldError(govEl, 'اختر المحافظة');
    if (!FormUX.isMeaningfulText(city)) return FormUX.markFieldError(cityEl, 'اسم المدينة مو واضح');
    if (!maxParticipants || maxParticipants < 2) return FormUX.markFieldError(playersEl, 'عدد اللاعبين لازم يكون 2 على الأقل');

    FormUX.setSubmitLoading(submitBtn, true, 'جاري الحفظ...');
    try {
      await MalaabakAPI.create("matches", {
        title, sport, governorate, city,
        venue_name: venueName,
        day: "قريباً", time: time || "يحدّد لاحقاً",
        level, age_group: null, fee: fee || 0,
        participants: 1, max_participants: maxParticipants,
        image: EMOJI[sport] || "⚽",
        phone: ($("mPhone").value.trim()) || null,
        description: ($("mDesc").value.trim()) || null,
      });
      FormUX.clearDraft();
      // Meta Pixel — قاع الـfunnel: الإضافة نجحت فعلاً (بعد ما رجع الـAPI بلا خطأ).
      window.MetaPixel?.addListing({
        type: 'match', category: sport,
        governorate, city, section: 'malaab',
      });
      FormUX.toast('تم إنشاء المباراة ✓', 'success', 2000);
      setTimeout(() => { location.href = "matches.html"; }, 1100);
    } catch (err) {
      console.error(err);
      FormUX.toast(FormUX.friendlyError(err), 'error');
      FormUX.setSubmitLoading(submitBtn, false);
    }
  });
})();
</script>
<script>SiteCore.mountFooter();</script>
</body>
</html>
