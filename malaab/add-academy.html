<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سجّل أكاديميتك | ملعبك</title>
<meta name="description" content="اعرض أكاديميتك الرياضية على منصة ملعبك ووصّل لأهالي بيدوّروا على تدريب محترف لولادهم.">
<meta name="keywords" content="تسجيل أكاديمية, أكاديمية رياضية سوريا, ملعبك">
<link rel="preconnect" href="https://uijijqkbctemcfdzoxlg.supabase.co" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../css/form-ux.css">
<script src="site-core.js"></script>
<script src="data.js"></script>
<script src="store.js"></script>
<script src="terms.js"></script>
<script src="../js/vendor/supabase.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/media-processor.js"></script>
<script src="../js/form-ux.js"></script>
<script src="malaabak-api.js"></script>
</head>
<body>

<div id="siteHeader"></div>
<script>SiteCore.mountHeader({ active: "academies" });</script>

<div class="form-box" style="max-width:520px;">
  <h1>سجّل أكاديميتك</h1>
  <p class="muted" style="text-align:center;margin-top:-10px;margin-bottom:20px;">
    أكاديميتك رح توصل للوحة التحكم للمراجعة، وبعد الموافقة بتظهر بصفحة الأكاديميات.
  </p>

  <div class="field">
    <label>اسم الأكاديمية <span class="req">*</span></label>
    <input type="text" id="aName" placeholder="مثال: أكاديمية النجوم" required maxlength="80">
  </div>
  <div class="field">
    <label>الرياضات (اختر واحدة أو أكثر) <span class="req">*</span></label>
    <div class="filter-checks" id="aSports">
      <label><input type="checkbox" value="كرة قدم"> كرة قدم</label>
      <label><input type="checkbox" value="كرة سلة"> كرة سلة</label>
      <label><input type="checkbox" value="كرة صالات"> كرة صالات</label>
      <label><input type="checkbox" value="كرة طائرة"> كرة طائرة</label>
      <label><input type="checkbox" value="سباحة"> سباحة</label>
      <label><input type="checkbox" value="تنس"> تنس</label>
    </div>
  </div>
  <div class="field">
    <label>المحافظة <span class="req">*</span></label>
    <select id="aGov" required></select>
    <script>document.getElementById('aGov').innerHTML = FormUX.governorateOptionsHTML();</script>
  </div>
  <div class="field">
    <label>المدينة / المنطقة <span class="req">*</span></label>
    <input type="text" id="aCity" placeholder="مثال: المزة" required>
  </div>
  <div class="field">
    <label>الفئات العمرية (اختر واحدة أو أكثر) <span class="req">*</span></label>
    <div class="filter-checks" id="aAges">
      <label><input type="checkbox" value="6-10"> 6 - 10 سنوات</label>
      <label><input type="checkbox" value="11-14"> 11 - 14 سنة</label>
      <label><input type="checkbox" value="15-18"> 15 - 18 سنة</label>
    </div>
  </div>
  <div class="field">
    <label>الاشتراك الشهري (ل.س) <span class="req">*</span></label>
    <input type="number" id="aFee" placeholder="مثال: 120000" min="0" step="5000" inputmode="numeric" required>
  </div>
  <div class="field">
    <label>صورة / شعار الأكاديمية</label>
    <div class="venue-image-uploader">
      <div class="venue-image-preview" id="acadImagePreview">
        <span class="venue-image-placeholder">اضغط لاختيار صورة</span>
        <span class="media-watermark" id="acadWatermark" style="display:none;">ملعبك</span>
      </div>
      <input type="file" accept="image/*" id="acadImageInput" hidden>
    </div>
    <p class="muted" style="font-size:12px;margin-top:6px;text-align:center;">علامة "ملعبك" المائية رح تنطبع تلقائياً على الصورة عند النشر.</p>
  </div>

  <div class="field">
    <label>نبذة عن الأكاديمية (اختياري)</label>
    <textarea id="aDesc" placeholder="برامج التدريب، المدربين، الإنجازات..." maxlength="800" rows="3" style="resize:vertical;"></textarea>
  </div>

  <div class="field">
    <label>رقم الجوال للتواصل (اختياري)</label>
    <input type="tel" id="aPhone" placeholder="09xxxxxxxx" inputmode="tel" maxlength="20">
  </div>

  <div class="field">
    <label>رابط يوتيوب (اختياري)</label>
    <input type="url" id="aVideo" placeholder="https://youtu.be/... (فيديو تعريفي عن الأكاديمية)">
  </div>

  <div id="termsSlot"></div>
  <script>document.getElementById("termsSlot").innerHTML = MalaabakTerms.block(); MalaabakTerms.init();</script>

  <button type="button" class="btn btn-primary" id="submitBtn" style="display:block;width:100%;">إرسال للمراجعة</button>
  <p class="muted" style="font-size:0.8em;text-align:center;margin-top:0.6em;">
    بعد الموافقة بتظهر أكاديميتك بصفحة الأكاديميات.
  </p>
</div>

<div id="siteFooter"></div>
<script>SiteCore.mountFooter();</script>

<script>
// ===== حفظ الأكاديمية (مع FormUX) =====
(async function setupAddAcademy() {
  const $ = (id) => document.getElementById(id);
  const submitBtn = $("submitBtn");

  await FormUX.requireAuth({ loginUrl: 'login.html', submitBtnId: 'submitBtn' });

  FormUX.attachLiveValidator($("aName"), FormUX.isMeaningfulText, 'اسم الأكاديمية مو واضح');
  FormUX.attachLiveValidator($("aCity"), FormUX.isMeaningfulText, 'اسم المدينة/المنطقة مو واضح');

  const preview = $("acadImagePreview");
  const input = $("acadImageInput");
  const placeholder = preview.querySelector(".venue-image-placeholder");
  const watermark = $("acadWatermark");
  preview.addEventListener("click", () => { if (!preview.classList.contains("has-image")) input.click(); });
  input.addEventListener("change", () => {
    const file = input.files[0];
    if (!file) return;
    if (!FormUX.checkFileSize(file, 5)) { input.value = ''; return; }
    preview.style.backgroundImage = `url('${URL.createObjectURL(file)}')`;
    preview.style.backgroundPosition = "center";
    preview.classList.add("has-image");
    placeholder.style.display = "none";
    watermark.style.display = "";
  });

  const sportsBoxes = [...document.querySelectorAll("#aSports input")];
  const agesBoxes = [...document.querySelectorAll("#aAges input")];

  submitBtn.addEventListener("click", async () => {
    if (submitBtn.dataset.authGate === '1') return;
    FormUX.clearFieldErrors();
    const nameEl = $("aName"), govEl = $("aGov"), cityEl = $("aCity"), feeEl = $("aFee"), videoEl = $("aVideo");
    const name = nameEl.value.trim();
    const sports = sportsBoxes.filter((b) => b.checked).map((b) => b.value);
    const governorate = govEl.value.trim();
    const city = cityEl.value.trim();
    const ageGroups = agesBoxes.filter((b) => b.checked).map((b) => b.value);
    const monthlyFee = Number(feeEl.value);
    const imageFile = $("acadImageInput").files[0];
    const ytRaw = videoEl.value.trim();

    if (!FormUX.isMeaningfulText(name)) return FormUX.markFieldError(nameEl, 'الرجاء كتابة اسم واضح للأكاديمية');
    if (!governorate) return FormUX.markFieldError(govEl, 'اختر المحافظة');
    if (!FormUX.isMeaningfulText(city)) return FormUX.markFieldError(cityEl, 'أدخل اسم مدينة/منطقة واضح');
    if (!sports.length) return FormUX.markFieldError(sportsBoxes[0], 'اختر رياضة واحدة على الأقل');
    if (!ageGroups.length) return FormUX.markFieldError(agesBoxes[0], 'اختر فئة عمرية واحدة على الأقل');
    if (!monthlyFee || monthlyFee <= 0) return FormUX.markFieldError(feeEl, 'أدخل اشتراك شهري صحيح');
    if (imageFile && !FormUX.checkFileSize(imageFile, 5)) return;
    if (ytRaw && !FormUX.isValidYouTubeUrl(ytRaw)) return FormUX.markFieldError(videoEl, 'رابط اليوتيوب مو صحيح');
    if (!$("agreeTerms").checked) return FormUX.markFieldError($("agreeTerms"), 'لازم توافق على شروط النشر');

    FormUX.setSubmitLoading(submitBtn, true, 'جاري الرفع...');
    try {
      let imageUrl = null;
      if (imageFile) {
        imageUrl = await MalaabakAPI.uploadImage(imageFile, `academies/${MalaabakAPI.slugify(name)}-${Date.now()}`, "ملعبك");
      }
      await MalaabakAPI.create("academies", {
        name, sports, governorate, city,
        age_groups: ageGroups, monthly_fee: monthlyFee, players: 0,
        image: imageUrl || null,
        phone: ($("aPhone").value.trim()) || null,
        description: ($("aDesc").value.trim()) || null,
        video_url: ytRaw || null,
      });
      FormUX.clearDraft();
      // Meta Pixel — قاع الـfunnel: الإضافة نجحت فعلاً (بعد ما رجع الـAPI بلا خطأ).
      window.MetaPixel?.addListing({
        type: 'academy', category: (sports || []).join('، '),
        governorate, city, section: 'malaab',
      });
      FormUX.toast('تم الإرسال للمراجعة ✓ أكاديميتك بتظهر بعد موافقة الإدارة.', 'success', 3000);
      setTimeout(() => { location.href = "academies.html"; }, 1400);
    } catch (err) {
      console.error(err);
      FormUX.toast(FormUX.friendlyError(err), 'error');
      FormUX.setSubmitLoading(submitBtn, false);
    }
  });
})();
</script>

<script src="../js/meta-pixel.js"></script>
<script src="../js/consent-banner.js"></script>
</body>
</html>
