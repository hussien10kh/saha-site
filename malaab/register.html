<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إنشاء حساب | ملعبك</title>
<meta name="description" content="أنشئ حسابك على ملعبك بخطوات بسيطة.">
<meta name="keywords" content="إنشاء حساب, ملعبك, ساحة">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="site-core.js"></script>
<script src="../js/vendor/supabase.js"></script>
<script src="../js/supabase-client.js"></script>
</head>
<body>

<div id="siteHeader"></div>
<script>SiteCore.mountHeader();</script>

<div class="form-box" style="max-width:460px;">
  <h1>إنشاء حساب</h1>
  <p class="muted" style="text-align:center;margin-top:-8px;margin-bottom:16px;font-size:13px;">
    نفس حساب ساحة — يعمل بكل الأقسام (إعلانات، سياحة، ملعبك).
  </p>

  <form id="regForm">
    <div class="field">
      <label>الاسم الكامل</label>
      <input type="text" id="name" required autocomplete="name">
    </div>
    <div class="field">
      <label>البريد الإلكتروني</label>
      <input type="email" id="email" required autocomplete="email" placeholder="example@mail.com">
    </div>
    <div class="field">
      <label>رقم الهاتف (اختياري)</label>
      <input type="text" id="phone" autocomplete="tel" placeholder="09xxxxxxxx">
    </div>
    <div class="field">
      <label>كلمة المرور</label>
      <input type="password" id="password" required minlength="6" autocomplete="new-password">
      <p class="muted" style="font-size:12px;margin-top:4px;">6 أحرف على الأقل</p>
    </div>

    <button type="submit" class="btn btn-primary" id="regBtn" style="display:block;width:100%;">إنشاء حساب</button>
    <p class="muted" id="regHint" style="font-size:13px;text-align:center;margin-top:10px;min-height:1em;"></p>
  </form>

  <p style="text-align:center;font-size:13px;margin-top:16px;">
    لديك حساب؟ <a href="login.html" style="color:#0f5c2a;text-decoration:underline;font-weight:700;">تسجيل الدخول</a>
  </p>
</div>

<div id="siteFooter"></div>
<script>SiteCore.mountFooter();</script>

<script>
(async function setupRegister() {
  const redirect = new URLSearchParams(location.search).get("redirect") || "index.html";
  const { data: { user } } = await sb.auth.getUser();
  if (user) { location.href = redirect; return; }

  const form = document.getElementById("regForm");
  const btn = document.getElementById("regBtn");
  const hint = document.getElementById("regHint");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    hint.textContent = "";
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const password = document.getElementById("password").value;

    if (password.length < 6) { hint.textContent = "كلمة المرور 6 أحرف على الأقل."; return; }

    btn.disabled = true; btn.textContent = "جاري إنشاء الحساب...";

    // trigger handle_new_user يُنشئ سجل بـprofiles تلقائياً، بس نحتاج نحدّث name/phone
    const { data, error } = await sb.auth.signUp({
      email, password,
      options: { data: { name, phone } },
    });
    if (error) {
      hint.textContent = error.message.includes("already registered")
        ? "البريد مسجّل مسبقاً — سجّل دخول."
        : "تعذّر التسجيل: " + error.message;
      btn.disabled = false; btn.textContent = "إنشاء حساب";
      return;
    }
    // بعد signUp: user موجود (لأن Confirm email معطّل بساحة). حدّث profile بالاسم والهاتف.
    if (data.user) {
      try {
        await sb.from("profiles").update({ name, phone: phone || null }).eq("id", data.user.id);
      } catch (_) { /* تجاهل — الحساب أُنشئ */ }
    }
    hint.textContent = "✓ تم إنشاء الحساب — عم نحوّلك...";
    setTimeout(() => { location.href = redirect; }, 800);
  });
})();
</script>

</body>
</html>
