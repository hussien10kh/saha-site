<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إنشاء حساب | ملعبك</title>
<meta name="description" content="أنشئ حسابك على ملعبك بخطوات بسيطة.">
<meta name="keywords" content="إنشاء حساب, ملعبك, ساحة">
<link rel="preconnect" href="https://uijijqkbctemcfdzoxlg.supabase.co" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../css/form-ux.css">
</head>
<body>

<div id="siteHeader"></div>

<div class="form-box" style="max-width:460px;">
  <h1>إنشاء حساب</h1>
  <p class="muted" style="text-align:center;margin-top:-8px;margin-bottom:16px;font-size:13px;">
    نفس حساب ساحة — يعمل بكل الأقسام (إعلانات، سياحة، ملعبك).
  </p>

  <form id="regForm" novalidate>
    <div class="field">
      <label>الاسم الكامل <span class="req">*</span></label>
      <input type="text" id="name" required autocomplete="name" maxlength="80">
    </div>
    <div class="field">
      <label>البريد الإلكتروني <span class="req">*</span></label>
      <input type="email" id="email" required autocomplete="email" placeholder="example@mail.com" inputmode="email">
    </div>
    <div class="field">
      <label>رقم الهاتف (اختياري)</label>
      <input type="tel" id="phone" autocomplete="tel" placeholder="09xxxxxxxx" inputmode="tel">
    </div>
    <div class="field">
      <label>كلمة المرور <span class="req">*</span></label>
      <div class="fux-pw-wrap">
        <input type="password" id="password" required minlength="6" autocomplete="new-password">
        <button type="button" class="fux-pw-toggle" data-target="password" aria-label="إظهار/إخفاء كلمة المرور">👁</button>
      </div>
      <p class="muted" style="font-size:12px;margin-top:4px;">6 أحرف على الأقل</p>
    </div>
    <div class="field">
      <label>تأكيد كلمة المرور <span class="req">*</span></label>
      <div class="fux-pw-wrap">
        <input type="password" id="password2" required autocomplete="new-password">
        <button type="button" class="fux-pw-toggle" data-target="password2" aria-label="إظهار/إخفاء كلمة المرور">👁</button>
      </div>
    </div>

    <button type="submit" class="btn btn-primary" id="regBtn" style="display:block;width:100%;">إنشاء حساب</button>
  </form>

  <p style="text-align:center;font-size:13px;margin-top:16px;">
    لديك حساب؟ <a href="login.html" style="color:#0f5c2a;text-decoration:underline;font-weight:700;">تسجيل الدخول</a>
  </p>
</div>

<div id="siteFooter"></div>


<script src="site-core.js"></script>
<script src="../js/vendor/supabase.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/form-ux.js"></script>
<script src="../js/meta-pixel.js"></script>
<script src="../js/consent-banner.js"></script>
<script>SiteCore.mountHeader();</script>
<script>SiteCore.mountFooter();</script>
<script>
// zerar للـpassword toggles (عام لكل الصفحة)
document.addEventListener('click', (e) => {
  const btn = e.target.closest('.fux-pw-toggle');
  if (!btn) return;
  const inp = document.getElementById(btn.dataset.target);
  if (!inp) return;
  inp.type = inp.type === 'password' ? 'text' : 'password';
  btn.textContent = inp.type === 'password' ? '👁' : '🙈';
});

(async function setupRegister() {
  const redirect = new URLSearchParams(location.search).get("redirect") || "index.html";
  const { data: { user } } = await sb.auth.getUser();
  if (user) { location.href = redirect; return; }

  const form = document.getElementById("regForm");
  const btn = document.getElementById("regBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    FormUX.clearFieldErrors();
    const nameEl = document.getElementById("name"), emailEl = document.getElementById("email"),
          phoneEl = document.getElementById("phone"), pwEl = document.getElementById("password"),
          pw2El = document.getElementById("password2");
    const name = nameEl.value.trim();
    const email = emailEl.value.trim();
    const phone = phoneEl.value.trim();
    const password = pwEl.value;
    const password2 = pw2El.value;

    if (!name) return FormUX.markFieldError(nameEl, 'الرجاء كتابة اسمك الكامل');
    if (!email || !/.+@.+\..+/.test(email)) return FormUX.markFieldError(emailEl, 'أدخل بريد إلكتروني صحيح');
    if (phone && !/^\+?\d[\d\s-]{6,}$/.test(phone)) return FormUX.markFieldError(phoneEl, 'أدخل رقم هاتف صحيح');
    if (password.length < 6) return FormUX.markFieldError(pwEl, 'كلمة المرور 6 أحرف على الأقل');
    if (password !== password2) return FormUX.markFieldError(pw2El, 'كلمة المرور ما بتطابق');

    FormUX.setSubmitLoading(btn, true, 'جاري إنشاء الحساب...');
    try {
      const { data, error } = await sb.auth.signUp({
        email, password,
        options: { data: { name, phone } },
      });
      if (error) throw error;

      // لو Confirm email مفعّل بـSupabase → data.session بيكون null → المستخدم لازم يفعّل قبل الدخول
      if (!data.session) {
        FormUX.toast('تم إنشاء الحساب ✓ افتح بريدك الإلكتروني لتفعيل الحساب.', 'success', 5000);
        setTimeout(() => { location.href = 'login.html'; }, 3000);
        return;
      }

      // Session موجودة → حدّث الـprofile (بعد ما صرنا authenticated)
      try {
        await sb.from("profiles").update({ name, phone: phone || null }).eq("id", data.user.id);
      } catch (_) {}
      // Meta Pixel: تسجيل حساب مكتمل
      try { if (typeof MetaPixel !== 'undefined') MetaPixel.register({ method: 'email' }); } catch (e) {}
      FormUX.toast('تم إنشاء الحساب ✓', 'success', 1500);
      setTimeout(() => { location.href = redirect; }, 1000);
    } catch (err) {
      console.error(err);
      FormUX.toast(FormUX.friendlyError(err), 'error');
      FormUX.setSubmitLoading(btn, false);
    }
  });
})();
</script>
</body>
</html>
