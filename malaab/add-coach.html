<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سجّل كمدرب | ملعبك</title>
<meta name="description" content="انضم لدليل المدربين على ملعبك ووصل خبرتك لآلاف اللاعبين بسوريا.">
<meta name="keywords" content="تسجيل مدرب, مدرب رياضي سوريا, ملعبك">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../css/form-ux.css">
<script src="site-core.js"></script>
<script src="data.js"></script>
<script src="store.js"></script>
<script src="terms.js"></script>
<script src="../js/vendor/supabase.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/media-processor.js"></script>
<script src="../js/form-ux.js"></script>
<script src="malaabak-api.js"></script>
</head>
<body>

<div id="siteHeader"></div>
<script>SiteCore.mountHeader({ active: "coaches" });</script>

<div class="form-box" style="max-width:520px;">
  <h1>سجّل كمدرب</h1>
  <p class="muted" style="text-align:center;margin-top:-10px;margin-bottom:20px;">
    ملفك رح يوصل للوحة التحكم للمراجعة، وبعد الموافقة بيظهر بصفحة المدربين.
  </p>

  <div class="field">
    <label>الاسم الكامل <span class="req">*</span></label>
    <input type="text" id="cName" placeholder="مثال: أحمد سلمان" required maxlength="80">
  </div>
  <div class="field">
    <label>التخصص <span class="req">*</span></label>
    <select id="cSpecialty" required>
      <option value="">اختر التخصص</option>
      <option>كرة قدم</option>
      <option>لياقة بدنية</option>
      <option>حراس مرمى</option>
      <option>يوغا</option>
      <option>كروس فت</option>
      <option>تأهيل إصابات</option>
    </select>
  </div>
  <div class="field">
    <label>المحافظة <span class="req">*</span></label>
    <select id="cGov" required></select>
    <script>document.getElementById('cGov').innerHTML = FormUX.governorateOptionsHTML();</script>
  </div>
  <div class="field">
    <label>المدينة / المنطقة <span class="req">*</span></label>
    <input type="text" id="cCity" placeholder="مثال: المزة" required>
  </div>
  <div class="field">
    <label>سنوات الخبرة <span class="req">*</span></label>
    <input type="number" id="cExperience" placeholder="مثال: 8" min="0" max="50" inputmode="numeric" required>
  </div>
  <div class="field">
    <label>سعر الحصة (ل.س) <span class="req">*</span></label>
    <input type="number" id="cPrice" placeholder="مثال: 30000" min="0" step="1000" inputmode="numeric" required>
  </div>
  <div class="field">
    <label>الجنس</label>
    <div class="role-picker" id="cGender">
      <div class="selected" data-value="ذكر">ذكر</div>
      <div data-value="أنثى">أنثى</div>
    </div>
  </div>
  <div class="field">
    <label>صورة المدرب</label>
    <div class="venue-image-uploader">
      <div class="venue-image-preview" id="coachImagePreview">
        <span class="venue-image-placeholder">اضغط لاختيار صورة</span>
        <span class="media-watermark" id="coachWatermark" style="display:none;">ملعبك</span>
      </div>
      <input type="file" accept="image/*" id="coachImageInput" hidden>
    </div>
    <p class="muted" style="font-size:12px;margin-top:6px;text-align:center;">علامة "ملعبك" المائية رح تنطبع تلقائياً على الصورة عند النشر.</p>
  </div>

  <div class="field">
    <label>نبذة عنك (اختياري)</label>
    <textarea id="cDesc" placeholder="خبرتك، إنجازاتك، أسلوب تدريبك..." maxlength="800" rows="3" style="resize:vertical;"></textarea>
  </div>

  <div class="field">
    <label>رقم الجوال للتواصل (اختياري)</label>
    <input type="tel" id="cPhone" placeholder="09xxxxxxxx" inputmode="tel" maxlength="20">
  </div>

  <div class="field">
    <label>رابط يوتيوب (اختياري)</label>
    <input type="url" id="cVideo" placeholder="https://youtu.be/... (فيديو تعريفي عنك أو حصة تدريب)">
  </div>

  <div id="termsSlot"></div>
  <script>document.getElementById("termsSlot").innerHTML = MalaabakTerms.block(); MalaabakTerms.init();</script>

  <button type="button" class="btn btn-primary" id="submitBtn" style="display:block;width:100%;">إرسال للمراجعة</button>
  <p class="muted" style="font-size:0.8em;text-align:center;margin-top:0.6em;">
    بعد الموافقة بيظهر ملفك بصفحة المدربين.
  </p>
</div>

<div id="siteFooter"></div>
<script>SiteCore.mountFooter();</script>

<script>
// ===== حفظ ملف المدرب (مع FormUX) =====
(async function setupAddCoach() {
  const $ = (id) => document.getElementById(id);
  const submitBtn = $("submitBtn");

  await FormUX.requireAuth({ loginUrl: 'login.html', submitBtnId: 'submitBtn' });

  FormUX.attachLiveValidator($("cName"), FormUX.isMeaningfulText, 'اسمك مو واضح — اكتبه بشكل صحيح');
  FormUX.attachLiveValidator($("cCity"), FormUX.isMeaningfulText, 'اسم المدينة/المنطقة مو واضح');

  const preview = $("coachImagePreview");
  const input = $("coachImageInput");
  const placeholder = preview.querySelector(".venue-image-placeholder");
  const watermark = $("coachWatermark");
  preview.addEventListener("click", () => { if (!preview.classList.contains("has-image")) input.click(); });
  input.addEventListener("change", () => {
    const file = input.files[0];
    if (!file) return;
    if (!FormUX.checkFileSize(file, 5)) { input.value = ''; return; }
    preview.style.backgroundImage = `url('${URL.createObjectURL(file)}')`;
    preview.style.backgroundPosition = "center";
    preview.classList.add("has-image");
    placeholder.style.display = "none";
    watermark.style.display = "";
  });

  let gender = "ذكر";
  $("cGender").addEventListener("click", (e) => {
    const opt = e.target.closest("[data-value]");
    if (!opt) return;
    $("cGender").querySelectorAll("div").forEach((d) => d.classList.remove("selected"));
    opt.classList.add("selected");
    gender = opt.dataset.value;
  });

  submitBtn.addEventListener("click", async () => {
    if (submitBtn.dataset.authGate === '1') return;
    FormUX.clearFieldErrors();
    const nameEl = $("cName"), specEl = $("cSpecialty"), govEl = $("cGov"),
          cityEl = $("cCity"), expEl = $("cExperience"), priceEl = $("cPrice"), videoEl = $("cVideo");
    const name = nameEl.value.trim();
    const specialty = specEl.value;
    const governorate = govEl.value.trim();
    const city = cityEl.value.trim();
    const experience = Number(expEl.value);
    const pricePerSession = Number(priceEl.value);
    const imageFile = $("coachImageInput").files[0];
    const ytRaw = videoEl.value.trim();

    if (!FormUX.isMeaningfulText(name)) return FormUX.markFieldError(nameEl, 'الرجاء كتابة اسمك الكامل (مو حروف مكررة)');
    if (!specialty) return FormUX.markFieldError(specEl, 'اختر التخصص');
    if (!governorate) return FormUX.markFieldError(govEl, 'اختر المحافظة');
    if (!FormUX.isMeaningfulText(city)) return FormUX.markFieldError(cityEl, 'أدخل اسم مدينة/منطقة واضح');
    if (Number.isNaN(experience) || experience < 0) return FormUX.markFieldError(expEl, 'أدخل سنوات خبرة صحيحة');
    if (!pricePerSession || pricePerSession <= 0) return FormUX.markFieldError(priceEl, 'أدخل سعر حصة صحيح');
    if (imageFile && !FormUX.checkFileSize(imageFile, 5)) return;
    if (ytRaw && !FormUX.isValidYouTubeUrl(ytRaw)) return FormUX.markFieldError(videoEl, 'رابط اليوتيوب مو صحيح');
    if (!$("agreeTerms").checked) return FormUX.markFieldError($("agreeTerms"), 'لازم توافق على شروط النشر');

    FormUX.setSubmitLoading(submitBtn, true, 'جاري الرفع...');
    try {
      let imageUrl = null;
      if (imageFile) {
        imageUrl = await MalaabakAPI.uploadImage(imageFile, `coaches/${MalaabakAPI.slugify(name)}-${Date.now()}`, "ملعبك");
      }
      await MalaabakAPI.create("coaches", {
        name, specialty, governorate, city,
        experience, price_per_session: pricePerSession, gender,
        image: imageUrl || null,
        phone: ($("cPhone").value.trim()) || null,
        description: ($("cDesc").value.trim()) || null,
        video_url: ytRaw || null,
      });
      FormUX.clearDraft();
      FormUX.toast('تم الإرسال للمراجعة ✓ ملفك بيظهر بعد موافقة الإدارة.', 'success', 3000);
      setTimeout(() => { location.href = "coaches.html"; }, 1400);
    } catch (err) {
      console.error(err);
      FormUX.toast(FormUX.friendlyError(err), 'error');
      FormUX.setSubmitLoading(submitBtn, false);
    }
  });
})();
</script>

</body>
</html>
