<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم | ساحة</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://uijijqkbctemcfdzoxlg.supabase.co" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="/manifest.json">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#15264a">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ساحة">
<style>
  @media (max-width:920px){ #sidebarToggle{display:flex !important;} }
  /* Badge أحمر بجانب كل تبويب فيه طلبات معلّقة */
  .admin-nav-item{position:relative;}
  .admin-nav-badge{
    background:#d93025;color:#fff;font-size:11px;font-weight:800;line-height:1;
    padding:3px 7px;border-radius:999px;margin-inline-start:auto;min-width:20px;
    display:inline-flex;align-items:center;justify-content:center;
  }
  /* Modal للمراجعة الكاملة */
  .admin-review-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;
    display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto;
  }
  .admin-review-modal{
    background:var(--surface,#fff);color:var(--text,#0f172a);border-radius:16px;
    max-width:720px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.35);
  }
  .admin-review-head{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:16px 20px;border-bottom:1px solid var(--border,#e5e7eb);position:sticky;top:0;
    background:var(--surface,#fff);z-index:2;
  }
  .admin-review-head h2{font-size:17px;margin:0;font-weight:800;}
  .admin-review-close{
    background:none;border:0;font-size:24px;cursor:pointer;color:var(--muted,#6b7280);
    width:32px;height:32px;border-radius:8px;
  }
  .admin-review-close:hover{background:var(--border,#e5e7eb);}
  .admin-review-body{padding:16px 20px;}
  .admin-review-gallery{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;}
  .admin-review-gallery img{width:180px;height:120px;object-fit:cover;border-radius:10px;flex-shrink:0;}
  .admin-review-field{display:grid;grid-template-columns:130px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--border,#f0f0f0);font-size:13.5px;}
  .admin-review-field:last-child{border-bottom:0;}
  .admin-review-field .k{color:var(--muted,#6b7280);font-weight:700;}
  .admin-review-field .v{color:var(--text,#0f172a);word-break:break-word;}
  .admin-review-field a{color:var(--primary,#2540d0);}
  .admin-review-actions{
    display:flex;gap:10px;padding:16px 20px;border-top:1px solid var(--border,#e5e7eb);
    position:sticky;bottom:0;background:var(--surface,#fff);
  }
  .admin-review-actions .btn{flex:1;}

  /* ---- أزرار القرار: أحمر للرفض/الحذف ---- */
  .btn-danger{background:var(--danger,#e0453d);color:#fff;border:1.5px solid var(--danger,#e0453d);}
  .btn-danger:hover{filter:brightness(.92);}
  .btn-danger-outline{background:transparent;color:var(--danger,#e0453d);border:1.5px solid var(--danger,#e0453d);}
  .btn-danger-outline:hover{background:var(--danger,#e0453d);color:#fff;}

  /* ---- تبويبات الحالة (بانتظار المراجعة / منشور / مرفوض) ---- */
  .admin-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--border);padding-bottom:10px;}
  .admin-tab{
    display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;border:1.5px solid var(--border);
    background:var(--surface);color:var(--text);font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;
  }
  .admin-tab.active{background:var(--primary);color:#fff;border-color:var(--primary);}
  .admin-tab-count{font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:rgba(0,0,0,.08);}
  .admin-tab.active .admin-tab-count{background:rgba(255,255,255,.25);}
  .admin-select{border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:13.5px;background:var(--surface);color:var(--text);}
  .admin-count{font-size:12.5px;color:var(--muted);margin:0 0 10px;}
  .admin-hint{font-size:12.5px;color:var(--muted);line-height:1.8;margin:6px 0 0;}
  .admin-badge.is-expired{background:#fde8e7;color:#b3261e;margin-inline-start:6px;}

  /* ---- ملخّص المحتوى بنظرة عامة ---- */
  .content-summary{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:22px;}
  .content-summary-card{
    text-align:start;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--surface);
    color:var(--text);font-family:inherit;cursor:pointer;
  }
  .content-summary-card:hover{border-color:var(--primary);}
  .cs-label{font-weight:800;margin-bottom:8px;}
  .cs-row{display:flex;flex-wrap:wrap;gap:6px;}
  .cs-pill{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--border);color:var(--muted);}
  .cs-pill.is-pending{background:#d93025;color:#fff;}
  .cs-pill.is-approved{background:#e3f6ec;color:#127a47;}

  /* ---- تبويب الزوار: شريط يومي وأعمدة جنب بعض ---- */
  .stats-bars{display:grid;gap:3px;align-items:end;height:120px;padding:8px 10px 22px;border:1px solid var(--border);border-radius:12px;background:var(--surface);margin-bottom:18px;position:relative;}
  .stats-bar{position:relative;height:100%;display:flex;align-items:flex-end;}
  .stats-bar-fill{width:100%;min-height:2px;background:var(--primary);border-radius:3px 3px 0 0;opacity:.85;}
  .stats-bar span{position:absolute;bottom:-18px;inset-inline:0;text-align:center;font-size:10px;color:var(--muted);}
  .stats-bars.dense .stats-bar span{display:none;}
  .stats-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;}
  .stats-bars.dense-hours .stats-bar span{font-size:9px;}
  @media (max-width:700px){ .stats-bars.dense-hours .stats-bar:nth-child(even) span{display:none;} }
  .ltr{direction:ltr;text-align:end;}
  /* ---- ملاحظات جاهزة ---- */
  .insights{display:flex;flex-direction:column;gap:8px;margin:4px 0 20px;}
  .insight{padding:10px 14px;border-radius:10px;font-size:13.5px;line-height:1.8;border:1px solid var(--border);background:var(--surface);}
  .insight.is-warn{border-color:#f0c36d;background:#fff8e6;color:#6b4e00;}
  .insight.is-ok{border-color:#9fd8b6;background:#ecf9f1;color:#0f5c2a;}
  .insight.is-info{border-color:var(--border);}
  :root[data-theme="dark"] .insight.is-warn{background:#3a2e10;color:#f5d98b;border-color:#6b5320;}
  :root[data-theme="dark"] .insight.is-ok{background:#12301f;color:#a9e6c0;border-color:#1f5a38;}
  /* ---- مسار التحويل ---- */
  .funnel{display:flex;flex-direction:column;gap:12px;margin-bottom:8px;}
  .funnel-step{padding:10px 14px;border:1px solid var(--border);border-radius:12px;background:var(--surface);}
  .funnel-label{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;margin-bottom:6px;}
  .funnel-bar{height:12px;background:var(--border);border-radius:999px;overflow:hidden;}
  .funnel-fill{height:100%;background:var(--primary);border-radius:999px;transition:width .3s;}
  .funnel-drop{margin-top:6px;font-size:12.5px;font-weight:700;color:var(--danger,#e0453d);}

  /* ---- بطاقة عنصر خاضع للإشراف ---- */
  .mod-card{display:flex;gap:14px;align-items:flex-start;padding:14px;border:1px solid var(--border);border-radius:12px;margin-bottom:10px;background:var(--surface);}
  .mod-img{width:84px;height:84px;object-fit:cover;border-radius:10px;flex-shrink:0;background:var(--border);}
  .mod-img-emoji{display:grid;place-items:center;font-size:2em;}
  .mod-body{flex:1;min-width:0;}
  .mod-title{font-weight:800;font-size:15px;}
  .mod-meta{font-size:.85em;color:var(--muted);margin-top:2px;}
  .mod-desc{font-size:.85em;margin-top:6px;line-height:1.7;}
  .mod-hint{font-size:.78em;color:var(--muted);margin:6px 0 0;line-height:1.7;}
  .mod-hint.is-ok{color:var(--success,#1a9c5e);font-weight:700;}
  .mod-yt{margin-top:10px;padding:10px;border:1px dashed var(--border);border-radius:8px;}
  .mod-yt label{display:block;font-size:.8em;color:var(--muted);margin-bottom:4px;}
  .mod-yt-row{display:flex;gap:6px;flex-wrap:wrap;}
  .mod-yt-row input{flex:1;min-width:200px;}
  .mod-yt input,.mod-video input{width:100%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:.85em;background:var(--surface);color:var(--text);}
  .mod-yt-row .btn{font-size:.8em;padding:6px 10px;}
  .mod-videos{margin-top:10px;display:flex;flex-direction:column;gap:8px;}
  .mod-video{padding:10px;border:1px dashed var(--border);border-radius:8px;}
  .mod-video-title{font-weight:700;margin-bottom:6px;font-size:.9em;}
  .mod-actions{display:flex;flex-direction:column;gap:6px;flex-shrink:0;min-width:150px;}
  .mod-actions .btn{font-size:.82em;padding:7px 12px;text-align:center;}
  @media (max-width:640px){
    .mod-card{flex-wrap:wrap;}
    .mod-actions{flex-direction:row;flex-wrap:wrap;width:100%;min-width:0;}
    .mod-actions .btn{flex:1 1 45%;}
  }
</style>
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <main class="admin-main">
    <div class="admin-topbar" id="adminTopbar"></div>
    <div id="adminContent"></div>
  </main>
</div>

<!-- Add / edit ad modal -->
<div class="modal-overlay" id="adModal">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">إضافة إعلان جديد</div>
      <button class="modal-close" id="modalCloseBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script src="js/vendor/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/app.js"></script>
<script src="malaab/malaabak-api.js"></script>
<script src="js/meta-pixel.js"></script>
<script src="js/consent-banner.js"></script>
<script src="js/site-stats.js"></script>
<script src="js/admin.js"></script>
<script>
  document.getElementById('modalCloseBtn').addEventListener('click', ()=>{
    document.getElementById('adModal').classList.remove('open');
  });
  document.getElementById('adModal').addEventListener('click', e=>{
    if(e.target.id === 'adModal') document.getElementById('adModal').classList.remove('open');
  });
</script>
</body>
</html>
