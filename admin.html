<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم | ساحة</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="/manifest.json">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#15264a">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ساحة">
<style>
  @media (max-width:920px){ #sidebarToggle{display:flex !important;} }
  /* Badge أحمر بجانب كل تبويب فيه طلبات معلّقة */
  .admin-nav-item{position:relative;}
  .admin-nav-badge{
    background:#d93025;color:#fff;font-size:11px;font-weight:800;line-height:1;
    padding:3px 7px;border-radius:999px;margin-inline-start:auto;min-width:20px;
    display:inline-flex;align-items:center;justify-content:center;
  }
  /* Modal للمراجعة الكاملة */
  .admin-review-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;
    display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto;
  }
  .admin-review-modal{
    background:var(--surface,#fff);color:var(--text,#0f172a);border-radius:16px;
    max-width:720px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.35);
  }
  .admin-review-head{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:16px 20px;border-bottom:1px solid var(--border,#e5e7eb);position:sticky;top:0;
    background:var(--surface,#fff);z-index:2;
  }
  .admin-review-head h2{font-size:17px;margin:0;font-weight:800;}
  .admin-review-close{
    background:none;border:0;font-size:24px;cursor:pointer;color:var(--muted,#6b7280);
    width:32px;height:32px;border-radius:8px;
  }
  .admin-review-close:hover{background:var(--border,#e5e7eb);}
  .admin-review-body{padding:16px 20px;}
  .admin-review-gallery{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;}
  .admin-review-gallery img{width:180px;height:120px;object-fit:cover;border-radius:10px;flex-shrink:0;}
  .admin-review-field{display:grid;grid-template-columns:130px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--border,#f0f0f0);font-size:13.5px;}
  .admin-review-field:last-child{border-bottom:0;}
  .admin-review-field .k{color:var(--muted,#6b7280);font-weight:700;}
  .admin-review-field .v{color:var(--text,#0f172a);word-break:break-word;}
  .admin-review-field a{color:var(--primary,#2540d0);}
  .admin-review-actions{
    display:flex;gap:10px;padding:16px 20px;border-top:1px solid var(--border,#e5e7eb);
    position:sticky;bottom:0;background:var(--surface,#fff);
  }
  .admin-review-actions .btn{flex:1;}
</style>
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <main class="admin-main">
    <div class="admin-topbar" id="adminTopbar"></div>
    <div id="adminContent"></div>
  </main>
</div>

<!-- Add / edit ad modal -->
<div class="modal-overlay" id="adModal">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">إضافة إعلان جديد</div>
      <button class="modal-close" id="modalCloseBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script src="js/vendor/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/app.js"></script>
<script src="malaab/malaabak-api.js"></script>
<script src="js/admin.js"></script>
<script>
  document.getElementById('modalCloseBtn').addEventListener('click', ()=>{
    document.getElementById('adModal').classList.remove('open');
  });
  document.getElementById('adModal').addEventListener('click', e=>{
    if(e.target.id === 'adModal') document.getElementById('adModal').classList.remove('open');
  });
</script>
</body>
</html>
