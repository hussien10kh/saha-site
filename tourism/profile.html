<style>
  /* ---- profile / login page (prototype styles, scoped "pr-") ----
     No real backend — accounts (name/email/phone/password) live in
     localStorage only. Same field set as ساحة's main platform signup,
     just themed for the tourism section (teal brand colors, a place
     pin icon instead of a generic one, tourism-flavored copy). */
  .pr-wrap{max-width:760px;margin:0 auto;padding:32px 20px 56px;}

  .pr-auth{
    max-width:400px;margin:30px auto;background:var(--t-surface);
    border:1px solid var(--t-border);border-radius:var(--t-radius-lg);padding:30px 26px;
  }
  .pr-auth-head{text-align:center;margin-bottom:20px;}
  .pr-auth-head .ic{
    width:56px;height:56px;border-radius:50%;background:var(--t-primary-light);color:var(--t-primary-dark);
    display:flex;align-items:center;justify-content:center;margin:0 auto 14px;
  }
  .pr-auth-head .ic svg{width:28px;height:28px;}
  .pr-auth-head h2{font-size:17px;margin:0 0 6px;}
  .pr-auth-head p{font-size:12.5px;color:var(--t-muted);margin:0;}

  .pr-tabs{display:flex;border:1px solid var(--t-border);border-radius:var(--t-radius-pill);padding:3px;margin-bottom:18px;}
  .pr-tab{
    flex:1;text-align:center;border:none;background:none;color:var(--t-muted);font-family:inherit;
    font-size:12.5px;font-weight:700;padding:9px;border-radius:var(--t-radius-pill);cursor:pointer;
  }
  .pr-tab.active{background:var(--t-primary);color:#fff;}

  .pr-field{margin-bottom:11px;}
  .pr-field label{display:block;font-size:11.5px;font-weight:700;color:var(--t-muted);margin-bottom:5px;}
  .pr-field input{
    width:100%;border:1px solid var(--t-border);border-radius:var(--t-radius-sm);padding:10px 12px;
    font-size:13px;font-family:inherit;color:var(--t-text);background:var(--t-bg);box-sizing:border-box;
  }
  .pr-error{font-size:12px;color:#dc2626;margin:-2px 0 10px;display:none;}
  .pr-error.show{display:block;}

  .pr-btn{
    display:flex;align-items:center;justify-content:center;gap:6px;border-radius:var(--t-radius-sm);
    padding:11px 16px;font-size:13px;font-weight:700;border:none;cursor:pointer;width:100%;font-family:inherit;
  }
  .pr-btn-primary{background:var(--t-primary);color:#fff;margin-top:6px;}
  .pr-btn-ghost{background:none;color:var(--t-muted);border:1px solid var(--t-border);}
  .pr-btn-google{background:var(--t-surface);color:var(--t-text);border:1px solid var(--t-border);}
  .pr-btn-google:hover{border-color:var(--t-primary);}
  .pr-btn-google svg{width:17px;height:17px;flex-shrink:0;}

  .pr-divider{display:flex;align-items:center;gap:10px;margin:16px 0;font-size:11.5px;color:var(--t-muted);}
  .pr-divider::before,.pr-divider::after{content:'';flex:1;height:1px;background:var(--t-border);}

  .pr-head{display:flex;align-items:center;gap:14px;margin-bottom:10px;flex-wrap:wrap;}
  .pr-avatar{
    width:64px;height:64px;border-radius:50%;background:var(--t-primary);color:#fff;font-size:22px;font-weight:800;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .pr-head h1{font-size:18px;margin:0 0 3px;}
  .pr-head p{font-size:12px;color:var(--t-muted);margin:0;}
  .pr-logout{margin-inline-start:auto;width:auto;padding:9px 16px;flex-shrink:0;}

  .pr-tabbar{display:flex;gap:6px;border-bottom:1px solid var(--t-border);margin:22px 0 20px;overflow-x:auto;scrollbar-width:none;}
  .pr-tabbar::-webkit-scrollbar{display:none;}
  .pr-tabbar button{
    border:none;background:none;color:var(--t-muted);font-family:inherit;font-size:12.5px;font-weight:700;
    padding:10px 4px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-inline-end:16px;flex-shrink:0;
  }
  .pr-tabbar button.active{color:var(--t-primary);border-bottom-color:var(--t-primary);}

  .pr-empty{font-size:12.5px;color:var(--t-muted);border:1px dashed var(--t-border);border-radius:var(--t-radius-md);padding:22px;text-align:center;}
  .pr-empty a{color:var(--t-primary);font-weight:700;}

  .pr-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  @media (max-width:520px){.pr-grid{grid-template-columns:1fr;}}

  .pr-card{
    display:flex;gap:12px;background:var(--t-surface);border:1px solid var(--t-border);border-radius:var(--t-radius-md);
    padding:10px;position:relative;
  }
  .pr-card-media{width:80px;height:80px;border-radius:var(--t-radius-sm);overflow:hidden;flex-shrink:0;}
  .pr-card-media img{width:100%;height:100%;object-fit:cover;display:block;}
  .pr-card-body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px;}
  .pr-card-body h4{font-size:13.5px;margin:0;}
  .pr-card-loc{font-size:11.5px;color:var(--t-muted);}

  .pr-added-item{
    background:var(--t-surface);border:1px solid var(--t-border);border-radius:var(--t-radius-md);
    padding:12px 14px;margin-bottom:10px;
  }
  .pr-added-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:3px;}
  .pr-added-top h4{font-size:13.5px;margin:0;}
  .pr-status{font-size:11px;font-weight:700;color:var(--t-accent);background:rgba(240,116,31,.12);border-radius:var(--t-radius-pill);padding:3px 10px;flex-shrink:0;}
  .pr-added-loc{font-size:11.5px;color:var(--t-muted);margin-bottom:4px;}
  .pr-added-desc{font-size:12px;color:var(--t-text);line-height:1.6;}

  .pr-review-item{border-top:1px solid var(--t-border);padding:12px 0;}
  .pr-review-item:first-child{border-top:none;}
  .pr-review-place{font-size:13px;font-weight:700;color:var(--t-primary);}
  .pr-review-stars{font-size:12px;color:var(--t-accent);letter-spacing:1px;margin:2px 0;}
  .pr-review-text{font-size:12.5px;color:var(--t-text);line-height:1.6;}
  .pr-review-date{font-size:11px;color:var(--t-muted);}

  .pr-settings-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--t-border);font-size:13px;}
  .pr-settings-row:first-child{border-top:none;}
  .pr-settings-label{color:var(--t-muted);font-size:12px;}
</style>
</head>

<script>
  (function(){
    var btn = document.getElementById('langToggle');
    if(!btn) return;
    var lang = (navigator.language || 'ar').toLowerCase().indexOf('en') === 0 ? 'en' : 'ar';
    function apply(){
      document.documentElement.setAttribute('lang', lang);
      document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
      btn.textContent = lang === 'ar' ? 'عربي' : 'English';
    }
    apply();
    btn.addEventListener('click', function(){
      lang = lang === 'ar' ? 'en' : 'ar';
      apply();
    });
  })();
</script>

<script>
  (function(){
    var root = document.getElementById('prRoot');
    var pinIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.4 7-12a7 7 0 1 0-14 0c0 5.6 7 12 7 12Z"/><circle cx="12" cy="9" r="2.5"/></svg>';
    var CATEGORY_LABEL = {food:'مطاعم', cafe:'مقاهي', landmark:'معالم', garden:'حدائق', shop:'متاجر'};
    var activeTab = 'favorites';

    /* Google button here is a mock too (no real backend to OAuth
       against) — it reuses the same authContinueWithSaha find-or-
       create-by-name flow as a stand-in for "you're already signed
       into ساحة via Google". Deliberately NOT styled to look like the
       real Google button (no Google logo/branding) since this never
       actually calls Google. */
    function renderAuth(mode){
      root.innerHTML =
        '<div class="pr-auth">' +
          '<div class="pr-auth-head">' +
            '<div class="ic">' + pinIcon + '</div>' +
            '<h2>أهلًا فيك بساحة سياحة</h2>' +
            '<p>سجّل حسابك حتى تحفظ الأماكن المفضلة، وتضيف أماكن، وتشارك تقييماتك</p>' +
          '</div>' +
          '<div class="pr-tabs">' +
            '<button type="button" class="pr-tab' + (mode==='login'?' active':'') + '" data-mode="login">تسجيل الدخول</button>' +
            '<button type="button" class="pr-tab' + (mode==='signup'?' active':'') + '" data-mode="signup">حساب جديد</button>' +
          '</div>' +
          (mode === 'signup'
            ? '<div class="pr-field"><label>الاسم الكامل</label><input id="prName" type="text" placeholder="اسمك"></div>' +
              '<div class="pr-field"><label>البريد الإلكتروني</label><input id="prEmail" type="email" placeholder="name@example.com"></div>' +
              '<div class="pr-field"><label>رقم الهاتف</label><input id="prPhone" type="tel" placeholder="09xxxxxxxx"></div>' +
              '<div class="pr-field"><label>كلمة المرور</label><input id="prPassword" type="password" placeholder="••••••••"></div>' +
              '<div class="pr-error" id="prError"></div>' +
              '<button type="button" class="pr-btn pr-btn-primary" id="prSubmit">إنشاء الحساب</button>'
            : '<div class="pr-field"><label>البريد الإلكتروني</label><input id="prEmail" type="email" placeholder="name@example.com"></div>' +
              '<div class="pr-field"><label>كلمة المرور</label><input id="prPassword" type="password" placeholder="••••••••"></div>' +
              '<div class="pr-error" id="prError"></div>' +
              '<button type="button" class="pr-btn pr-btn-primary" id="prSubmit">تسجيل الدخول</button>') +
          '<div class="pr-divider">أو</div>' +
          '<button type="button" class="pr-btn pr-btn-google" id="prGoogleBtn">' +
            '<svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.5 12.2c0-.8-.1-1.5-.2-2.2H12v4.3h5.9c-.3 1.4-1 2.5-2.2 3.3v2.7h3.6c2.1-2 3.2-4.8 3.2-8.1Z"/><path fill="#34A853" d="M12 23c3 0 5.4-1 7.3-2.7l-3.6-2.7c-1 .7-2.2 1.1-3.7 1.1-2.8 0-5.2-1.9-6-4.5H2.3v2.8C4.2 20.6 7.8 23 12 23Z"/><path fill="#FBBC05" d="M6 14.2c-.2-.7-.3-1.4-.3-2.2s.1-1.5.3-2.2V7H2.3A11 11 0 0 0 1 12c0 1.8.4 3.5 1.3 5l3.7-2.8Z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.2-3.2C17.4 2 15 1 12 1 7.8 1 4.2 3.4 2.3 7l3.7 2.8c.8-2.6 3.2-4.4 6-4.4Z"/></svg>' +
            'المتابعة عبر جوجل' +
          '</button>' +
        '</div>';

      root.querySelectorAll('.pr-tab').forEach(function(tab){
        tab.addEventListener('click', function(){ renderAuth(tab.getAttribute('data-mode')); });
      });

      document.getElementById('prGoogleBtn').addEventListener('click', function(){
        var name = prompt('معاينة فقط — هيك رح يبين اسمك متل ما جوجل رح يرجعه:', 'زائر جوجل');
        if (name === null) return;
        authContinueWithSaha(name.trim() || 'زائر جوجل');
        render();
      });

      document.getElementById('prSubmit').addEventListener('click', function(){
        var errEl = document.getElementById('prError');
        var email = document.getElementById('prEmail').value.trim();
        var password = document.getElementById('prPassword').value;

        if (mode === 'signup') {
          var name = document.getElementById('prName').value.trim();
          var phone = document.getElementById('prPhone').value.trim();
          if (!name || !email || !password) {
            errEl.textContent = 'عبّي الاسم والبريد وكلمة المرور.';
            errEl.classList.add('show');
            return;
          }
          var result = authSignup({name:name, email:email, phone:phone, password:password});
          if (result === 'exists') {
            errEl.textContent = 'في حساب مسجّل بهاد البريد أصلًا — جرب "تسجيل الدخول".';
            errEl.classList.add('show');
            return;
          }
          render();
        } else {
          if (!email || !password) {
            errEl.textContent = 'عبّي البريد وكلمة المرور.';
            errEl.classList.add('show');
            return;
          }
          var res = authLogin(email, password);
          if (res === 'notfound') {
            errEl.textContent = 'ما في حساب بهاد البريد — جرب "حساب جديد".';
            errEl.classList.add('show');
            return;
          }
          if (res === 'wrong') {
            errEl.textContent = 'كلمة المرور غلط.';
            errEl.classList.add('show');
            return;
          }
          render();
        }
      });
    }

    function renderFavoritesSection(user){
      var favPlaces = favoritesGetAll().map(placesGetById).filter(Boolean);
      if (!favPlaces.length) {
        return '<div class="pr-empty">لسا ما ضفت أماكن للمفضلة — اضغط ♡ على أي مكان يعجبك من <a href="places.html">صفحة الأماكن</a> وبيصير هون.</div>';
      }
      return '<div class="pr-grid">' + favPlaces.map(function(p){
        return '<a class="pr-card" href="place.html?id=' + p.id + '">' +
          '<div class="pr-card-media"><img src="images/' + p.image + '" alt="' + p.name + '" loading="lazy"></div>' +
          '<div class="pr-card-body"><h4>' + p.name + '</h4><div class="pr-card-loc">' + p.area + '، ' + p.city + '</div></div>' +
        '</a>';
      }).join('') + '</div>';
    }

    async function renderAddedSection(user){
      var mine = await addedPlacesGetByUser(user.email);
      if (!mine.length) {
        return '<div class="pr-empty">لسا ما ضفت أي مكان — <a href="add-place.html">ضيف أول مكان إلك</a> وبيبين هون وقت المراجعة.</div>';
      }
      return mine.map(function(p){
        return '<div class="pr-added-item">' +
          '<div class="pr-added-top"><h4>' + p.name + '</h4><span class="pr-status">' + p.status + '</span></div>' +
          '<div class="pr-added-loc">' + (CATEGORY_LABEL[p.category] || '') + ' — ' + p.loc + '</div>' +
          (p.desc ? '<div class="pr-added-desc">' + p.desc + '</div>' : '') +
        '</div>';
      }).join('');
    }

    function renderReviewsSection(user){
      var mine = placesGetReviewsByUser(user.email);
      if (!mine.length) {
        return '<div class="pr-empty">لسا ما كتبت أي تقييم — زور صفحة أي مكان وشاركنا رأيك فيه.</div>';
      }
      return mine.map(function(item){
        var stars = '★'.repeat(item.review.rating) + '☆'.repeat(5 - item.review.rating);
        return '<div class="pr-review-item">' +
          '<a class="pr-review-place" href="place.html?id=' + item.place.id + '">' + item.place.name + '</a>' +
          '<div class="pr-review-stars">' + stars + '</div>' +
          '<div class="pr-review-text">' + item.review.text + '</div>' +
          '<div class="pr-review-date">' + item.review.date + '</div>' +
        '</div>';
      }).join('');
    }

    function renderSettingsSection(user){
      return '<div class="pr-empty" style="margin-bottom:16px;text-align:start;">' +
          'البريد ورقم الهاتف وكلمة المرور بيتم إدارتهم من حسابك بمنصة ساحة نفسها، مو من هون.' +
        '</div>' +
        '<div class="pr-settings-row"><span class="pr-settings-label">الاسم</span><span>' + user.name + '</span></div>' +
        '<div class="pr-settings-row"><span class="pr-settings-label">عضو منذ</span><span>' + user.joined + '</span></div>';
    }

    var TABS = [
      {key:'favorites', label:'🩷 المفضلة', render:renderFavoritesSection},
      {key:'added', label:'📍 أماكني المضافة', render:renderAddedSection},
      {key:'reviews', label:'⭐ تقييماتي', render:renderReviewsSection},
      {key:'settings', label:'⚙️ الإعدادات', render:renderSettingsSection}
    ];

    function renderProfile(user){
      var initial = (user.name || 'ز').trim().charAt(0);

      root.innerHTML =
        '<div class="pr-head">' +
          '<div class="pr-avatar">' + initial + '</div>' +
          '<div><h1>' + user.name + '</h1><p>عضو منذ ' + user.joined + '</p></div>' +
          '<button type="button" class="pr-btn pr-btn-ghost pr-logout" id="prLogoutBtn">تسجيل خروج</button>' +
        '</div>' +
        '<div class="pr-tabbar">' +
          TABS.map(function(t){ return '<button type="button" data-tab="' + t.key + '"' + (t.key===activeTab?' class="active"':'') + '>' + t.label + '</button>'; }).join('') +
        '</div>' +
        '<div id="prTabBody"></div>';

      document.getElementById('prLogoutBtn').addEventListener('click', function(){
        authLogout();
        render();
      });

      root.querySelectorAll('.pr-tabbar button').forEach(function(btn){
        btn.addEventListener('click', function(){
          activeTab = btn.getAttribute('data-tab');
          renderProfile(user);
        });
      });

      var active = TABS.filter(function(t){ return t.key === activeTab; })[0] || TABS[0];
      Promise.resolve(active.render(user)).then(function(html){
        var body = document.getElementById('prTabBody');
        if (!body) return;
        body.innerHTML = html;
        favoritesWireButtons(body);
      });
    }

    function render(){
      var user = authGetUser();
      if (!user) { renderAuth('login'); return; }
      renderProfile(user);
    }

    render();
  })();
</script>
</body>
</html>
