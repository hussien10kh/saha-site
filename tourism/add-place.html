<script>
  document.querySelectorAll('.f-role-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      document.querySelectorAll('.f-role-chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
    });
  });

  // ===== إضافة مكان سياحي إلى Supabase (tourism_places) =====
  (async function setupAddPlace(){
    const $ = id => document.getElementById(id);
    const submitBtn = $('fSubmit');

    // Auth guard على load: شريط علوي + قفل الزر لو مو مسجّل + حفظ Draft
    await FormUX.requireAuth({ loginUrl: '../login.html', submitBtnId: 'fSubmit' });

    FormUX.attachLiveValidator($('fName'), FormUX.isMeaningfulText, 'اسم المكان مو واضح');
    FormUX.attachLiveValidator($('fCity'), FormUX.isMeaningfulText, 'اسم المدينة مو واضح');
    FormUX.attachLiveValidator($('fAddress'), (v) => FormUX.isMeaningfulText(v, 5), 'العنوان قصير أو مو واضح');

    // معاينة الصورة المختارة
    const imgInput = $('fImage'), imgLabel = $('fImageLabel');
    imgInput.addEventListener('change', () => {
      const f = imgInput.files[0];
      if (!f) { imgLabel.textContent = '📷 اضغط لاختيار صورة (حد أقصى 5 ميغا)'; return; }
      if (!FormUX.checkFileSize(f, 5)) { imgInput.value = ''; return; }
      imgLabel.textContent = '✓ ' + f.name + ' — اضغط لتغييرها';
    });

    submitBtn.addEventListener('click', async () => {
      if (submitBtn.dataset.authGate === '1') return;
      FormUX.clearFieldErrors();

      const nameEl = $('fName'), typeEl = $('fType'), regionEl = $('fRegion'),
            cityEl = $('fCity'), addrEl = $('fAddress'), descEl = $('fDesc'),
            videoEl = $('fVideo');
      const name = nameEl.value.trim();
      const category = typeEl.value;
      const region = regionEl.value.trim();
      const city = cityEl.value.trim();
      const address = addrEl.value.trim();
      const description = descEl.value.trim();
      const ytRaw = videoEl.value.trim();
      const imageFile = imgInput.files[0];

      if (!FormUX.isMeaningfulText(name)) return FormUX.markFieldError(nameEl, 'اسم المكان مو واضح');
      if (!category) return FormUX.markFieldError(typeEl, 'اختر نوع المكان');
      if (!region) return FormUX.markFieldError(regionEl, 'اختر المحافظة');
      if (!FormUX.isMeaningfulText(city)) return FormUX.markFieldError(cityEl, 'اسم المدينة مو واضح');
      if (imageFile && !FormUX.checkFileSize(imageFile, 5)) return;
      if (ytRaw && !FormUX.isValidYouTubeUrl(ytRaw)) return FormUX.markFieldError(videoEl, 'رابط اليوتيوب مو صحيح');

      FormUX.setSubmitLoading(submitBtn, true, 'جاري الإرسال...');
      try {
        // 1) تأكد من المستخدم (RLS شرط added_by = auth.uid)
        const { data: { user } } = await sb.auth.getUser();
        if (!user) throw new Error('انتهت جلستك. سجّل دخول من جديد.');

        // 2) رفع الصورة (اختياري) — إلى sahat-media تحت مسار المستخدم/tourism
        const images = [];
        if (imageFile) {
          const safeId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
          const key = `${user.id}/tourism/place-${safeId}.webp`;
          let blob = imageFile;
          if (window.MediaProcessor) {
            try { blob = await MediaProcessor.processImage(imageFile, { label: 'ساحة', output: 'blob' }); } catch(e) {}
          }
          const { error: upErr } = await sb.storage.from('sahat-media').upload(key, blob, {
            upsert: true, cacheControl: '3600', contentType: 'image/webp'
          });
          if (upErr) throw upErr;
          const { data } = sb.storage.from('sahat-media').getPublicUrl(key);
          images.push(data.publicUrl);
        }

        // 3) إنشاء السجل (status=pending تلقائياً من SQL default)
        const { error } = await sb.from('tourism_places').insert({
          added_by: user.id,
          name, category, region, city,
          address: address || null,
          description: description || null,
          phone: ($('fPhone').value.trim()) || null,
          images,
          video_url: ytRaw || null,
        });
        if (error) throw error;

        FormUX.clearDraft();
        // Meta Pixel — قاع الـfunnel: الإضافة نجحت فعلاً (بعد ما رجع الـAPI بلا خطأ).
        window.MetaPixel?.addListing({
          type: 'place', category,
          governorate: region, city, section: 'tourism',
        });
        FormUX.toast('تم الإرسال ✓ مكانك رح يظهر بعد موافقة الإدارة.', 'success', 3000);
        setTimeout(() => { location.href = 'profile.html'; }, 1500);
      } catch (err) {
        console.error(err);
        FormUX.toast(FormUX.friendlyError(err), 'error');
        FormUX.setSubmitLoading(submitBtn, false);
      }
    });
  })();
  (function(){
    var btn = document.getElementById('langToggle');
    if(!btn) return;
    var lang = (navigator.language || 'ar').toLowerCase().indexOf('en') === 0 ? 'en' : 'ar';
    function apply(){
      document.documentElement.setAttribute('lang', lang);
      document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
      btn.textContent = lang === 'ar' ? 'عربي' : 'English';
    }
    apply();
    btn.addEventListener('click', function(){
      lang = lang === 'ar' ? 'en' : 'ar';
      apply();
    });
  })();
</script>
